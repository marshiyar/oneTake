rule = "no-concurrency"
workflow = "mpvfx-macos.yml"
job = ""
count = 1
reason = "Runs almost only as mpvfx-ci's macos job, under mpvfx-ci's ref group; a group of its own matters only for hand dispatches. Follow-up after #56."

[[allow]]
rule = "no-concurrency"
workflow = "merge-train.yml"
job = ""
count = 1
reason = "The train job has its own merge-train group; record runs once per `queue` label event and only comments on that PR (merge_train.py record). Follow-up gives record a group per PR."

[[allow]]
rule = "no-concurrency"
workflow = "scorecard.yml"
job = ""
count = 1
reason = "Weekly and on push to main only; two overlapping runs publish the same score. Follow-up adds a ref group."

# --- token and secrets scope ----------------------------------------------------------------------------------------

[[allow]]
rule = "top-level-write"
workflow = "agentbot.yml"
job = ""
count = 1
reason = "All four jobs post comments or edit the Flaky tests issue, and none checks out or runs PR code. Follow-up moves the write scopes into each job."

[[allow]]
rule = "workflow-env-secret"
workflow = "agentbot.yml"
job = ""
count = 1
reason = "GITHUB_TOKEN (github.token) in the top-level env: every job of agentbot calls the API with it, so every job needs it today. Follow-up moves it to job level."

[[allow]]
rule = "secrets-inherit"
workflow = "mpvfx-ci.yml"
job = "macos"
count = 1
reason = "The callee reads only the five optional Apple signing secrets, and never on pull requests. Naming them in workflow_call.secrets edits the required path; follow-up after #56."
