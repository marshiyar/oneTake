# Findings of .github/ci/workflow_lint.py that are accepted for now, each with its reason (.github/CHECKS.md).
#
# This list only shrinks. An entry that no longer matches a finding fails the lint (remove it in the PR that fixes the
# workflow), and on a pull request an entry that main's copy does not have fails it too: a new workflow, or a new job
# in an old one, follows every rule from its first commit. One entry covers one rule in one job of one workflow
# (job = "" for the workflow itself), and `count` is how many such findings it accepts: one more fails as new, one
# fewer fails until the count is lowered. Recorded 2026-10-21 against main 959c44d; issue #116 removed the
# persist-credentials, python-isolation, agentbot token-scope and merge-train/scorecard concurrency entries by fixing
# the workflows.

# --- persist-credentials: the checkout leaves the job's token in .git/config -------------------------------------------

[[allow]]
rule = "untrusted-checkout"
workflow = "codex-apply.yml"
job = "apply"
count = 1
reason = "issue_comment checks out the PR head (steps.pr.outputs.sha) on purpose, to apply Codex's diff to it. The step before refuses PRs from forks and closed PRs; nothing from the tree runs (the checker comes from main, then git apply/commit/push)."

# --- no-version-comment ---------------------------------------------------------------------------------------------
# compnerd/gha-setup-swift is pinned to 775d3f4111c5be58a0f62f2efdd353bb8fac15c7, the head of its main branch, which no
# release tag points at (git ls-remote of the action's repository, 2026-10-21; newest tag v0.5.1 is another commit).
# There is no version to write; a follow-up either moves to a tagged release or writes `# main 2026-10-21`.

[[allow]]
rule = "no-version-comment"
workflow = "mpvfx-ci.yml"
job = "windows"
count = 1
reason = "Pinned to an untagged commit of compnerd/gha-setup-swift main; no version exists to name (see the comment above)."

[[allow]]
rule = "no-version-comment"
workflow = "mpvfx-ci.yml"
job = "windows-test"
count = 1
reason = "Pinned to an untagged commit of compnerd/gha-setup-swift main; no version exists to name (see the comment above)."

[[allow]]
rule = "no-version-comment"
workflow = "bench.yml"
job = "windows"
count = 1
reason = "Pinned to an untagged commit of compnerd/gha-setup-swift main; no version exists to name (see the comment above)."

# --- concurrency ----------------------------------------------------------------------------------------------------

[[allow]]
rule = "no-concurrency"
workflow = "mpvfx-macos.yml"
job = ""
count = 1
reason = "Runs almost only as mpvfx-ci's macos job, under mpvfx-ci's ref group; a group of its own matters only for hand dispatches. Follow-up after #56."

# --- token and secrets scope ----------------------------------------------------------------------------------------

[[allow]]
rule = "secrets-inherit"
workflow = "mpvfx-ci.yml"
job = "macos"
count = 1
reason = "The callee reads only the five optional Apple signing secrets, and never on pull requests. Naming them in workflow_call.secrets edits the required path; follow-up after #56."
