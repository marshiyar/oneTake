# Approves a pull request as the project's review bot (a GitHub App), never as the account that wrote it. The
# repository owner comments `/agent-approve <full head sha>` after reviewing; this job approves only when the comment
# comes from the owner's account, names the PR's current head, and `ci-ok` passed on exactly that commit.
# Needs the repository secrets AGENT_APP_ID and AGENT_APP_PRIVATE_KEY (the App's id and private key); without them the
# job fails and nothing is approved.
name: agent-approve

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: agent-approve-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/agent-approve ') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Token for the review App
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - name: Approve when the named head is the PR's head and ci-ok passed on it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -eu
          sha=$(printf '%s\n' "$BODY" | head -n 1 | sed -n 's|^/agent-approve \([0-9a-f]\{40\}\)[[:space:]]*$|\1|p')
          [ -n "$sha" ] || { echo "::error::first line must be /agent-approve <40-character head sha>"; exit 1; }
          set -- $(gh api "repos/$REPO/pulls/$PR" --jq '"\(.head.sha) \(.base.ref) \(.draft)"')
          head=$1 base=$2 draft=$3
          [ "$head" = "$sha" ] || { echo "::error::the PR head is $head, not $sha: review the new head first"; exit 1; }
          [ "$base" = main ] && [ "$draft" = false ] || { echo "::error::only a ready pull request into main is approved"; exit 1; }
          ok=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
          [ "$ok" -gt 0 ] || { echo "::error::ci-ok has not passed on $sha"; exit 1; }
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$sha" -f event=APPROVE \
            -f body="Approved after review ($COMMENT_URL): ci-ok passed on $sha." --jq '.html_url'
      # The approval is the last thing a pull request needs: from here GitHub merges it (squash) once every required
      # check passes, through the merge queue when the ruleset has one. Done with the App's token, so the merge is a
      # push that starts the workflows on main (a merge made with the workflow's own token would not).
      - name: Merge when the required checks pass
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
        run: |
          set -u
          sha=$(printf '%s\n' "$BODY" | head -n 1 | sed -n 's|^/agent-approve \([0-9a-f]\{40\}\)[[:space:]]*$|\1|p')
          [ -n "$sha" ] || { echo "::error::no approved sha in the comment"; exit 1; }
          # Bind to the approved commit: read the head again right before, and let GitHub check it too (expectedHeadOid).
          set -- $(gh api "repos/$REPO/pulls/$PR" --jq '"\(.head.sha) \(.node_id)"')
          [ "$1" = "$sha" ] || { echo "::error::the PR head is now $1, not the approved $sha: auto-merge not turned on"; exit 1; }
          id=$2
          if out=$(gh api graphql -f id="$id" -f sha="$sha" -f query='mutation($id: ID!, $sha: GitObjectID!) {
                enablePullRequestAutoMerge(input: {pullRequestId: $id, mergeMethod: SQUASH, expectedHeadOid: $sha}) { clientMutationId } }' 2>&1); then
            echo "auto-merge on: GitHub merges #$PR when its required checks pass"
          elif printf '%s' "$out" | grep -qi "clean status"; then
            # Already mergeable (green, approved, up to date): auto-merge refuses that state, so merge it now.
            gh api -X PUT "repos/$REPO/pulls/$PR/merge" -f merge_method=squash -f sha="$sha" --jq '.message'
          else
            echo "::warning::auto-merge not turned on for #$PR: $out (it needs Settings > General > Allow auto-merge)"
          fi
