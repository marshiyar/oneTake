# Approves a pull request as the project's review bot (a GitHub App), never as the account that wrote it. The
# repository owner comments `/agent-approve <full head sha>` after reviewing; this job approves only when the comment
# comes from the owner's account, names the PR's current head, and `ci-ok` passed on exactly that commit.
# Needs the repository secrets AGENT_APP_ID and AGENT_APP_PRIVATE_KEY (the App's id and private key); without them the
# job fails and nothing is approved.
#
# Merge trains (merge-train.yml) are approved without a comment, by job approve-train: when mpvfx-ci passes on a
# train/<n> pull request that the merge train opened, and `merge_train.py verify` finds its files are exactly main
# plus commits the owner queued (each listed pull request labelled `queue` by the owner, at the recorded commit).
name: agent-approve

on:
  issue_comment:
    types: [created]
  workflow_run:   # zizmor: ignore[dangerous-triggers] approve-train checks out main only and runs nothing from the train
    workflows: [mpvfx-ci]
    types: [completed]
    branches: ['train/**']

permissions:
  contents: read

concurrency:
  group: agent-approve-${{ github.event.issue.number || github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  approve:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/agent-approve ') &&
      github.event.comment.author_association == 'OWNER'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Token for the review App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
      - name: Approve when the named head is the PR's head and ci-ok passed on it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          BODY: ${{ github.event.comment.body }}
          COMMENT_URL: ${{ github.event.comment.html_url }}
        run: |
          set -eu
          sha=$(printf '%s\n' "$BODY" | head -n 1 | sed -n 's|^/agent-approve \([0-9a-f]\{40\}\)[[:space:]]*$|\1|p')
          [ -n "$sha" ] || { echo "::error::first line must be /agent-approve <40-character head sha>"; exit 1; }
          set -- $(gh api "repos/$REPO/pulls/$PR" --jq '"\(.head.sha) \(.base.ref) \(.draft)"')
          head=$1 base=$2 draft=$3
          [ "$head" = "$sha" ] || { echo "::error::the PR head is $head, not $sha: review the new head first"; exit 1; }
          [ "$base" = main ] && [ "$draft" = false ] || { echo "::error::only a ready pull request into main is approved"; exit 1; }
          ok=$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=ci-ok" \
            --jq '[.check_runs[] | select(.app.slug == "github-actions" and .conclusion == "success")] | length')
          [ "$ok" -gt 0 ] || { echo "::error::ci-ok has not passed on $sha"; exit 1; }
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$sha" -f event=APPROVE \
            -f body="Approved after review ($COMMENT_URL): ci-ok passed on $sha." --jq '.html_url'

  approve-train:
    if: >-
      github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'train/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Token for the review App
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.AGENT_APP_ID }}
          private-key: ${{ secrets.AGENT_APP_PRIVATE_KEY }}
          permission-pull-requests: write   # the review
          permission-issues: read           # label events and the queue records
          permission-checks: read           # ci-ok on the train head
      # main only: the train's commits are fetched and merged with git to compare trees, never run.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Check the train is main plus commits the owner queued, and ci-ok passed on its head
        id: verify
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP_LOGIN: ${{ steps.app.outputs.app-slug }}[bot]
          OWNER: ${{ github.repository_owner }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: python3 -I -B .github/ci/merge_train.py verify --branch "$BRANCH" --sha "$SHA"
      - name: Approve the train
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          REPO: ${{ github.repository }}
          PR: ${{ steps.verify.outputs.pr }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$SHA" -f event=APPROVE \
            -f body="Merge train approved: ci-ok passed on $SHA, and its files are main plus the commits the owner queued." \
            --jq '.html_url'
