# GENERATED by .github/ci/source_workflows.py from mpvfx-ci.yml: do not edit; change the source and rerun it.
# Called only by OneTake-app/OneTake-actionRunners-1 to run these jobs on a named oneTake commit on that
# organization's runners: no caches, no secrets, no write token, no token left in the checkouts.
name: mpvfx-ci-tests-source
'on':
  workflow_call:
    inputs:
      linux_shards:
        type: string
        default: '[]'
      source_repository:
        type: string
        required: true
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      linux_shards: ${{ steps.pick.outputs.linux }}
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.source_repository }}
        ref: ${{ inputs.source_ref }}
        persist-credentials: false
    - name: The shards asked for
      id: pick
      env:
        LINUX: ${{ inputs.linux_shards }}
      run: |
        swift package dump-package > "$RUNNER_TEMP/package.json"
        python3 -I -B ../.github/ci/test-shards.py --os linux "$RUNNER_TEMP/package.json" > "$RUNNER_TEMP/linux.json"
        python3 -I -B - <<'PY'
        import json, os
        out = {}
        for name in ("linux",):
            want = json.loads(os.environ[name.upper()])
            with open(os.path.join(os.environ["RUNNER_TEMP"], f"{name}.json")) as f:
                shards = json.load(f)
            known = {s["shard"] for s in shards}
            if not isinstance(want, list) or not all(isinstance(n, str) and n in known for n in want):
                raise SystemExit(f"::error::{name}_shards {want!r} names a shard test-shards.py does not have")
            out[name] = [s for s in shards if s["shard"] in want]
            print(f"{name}: {[s['shard'] for s in out[name]]}")
        with open(os.environ["GITHUB_OUTPUT"], "a") as f:
            f.write(f"linux={json.dumps(out['linux'])}\n")
        PY
  linux-test:
    needs: plan
    if: needs.plan.outputs.linux_shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_shards) }}
    name: linux test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
    - name: System packages
      working-directory: /
      run: |
        apt-get update -q
        DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
          git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev libpulse-dev \
          xvfb xauth dbus-x11 python3 file libvulkan-dev mesa-vulkan-drivers
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ inputs.source_repository }}
        ref: ${{ inputs.source_ref }}
        persist-credentials: false
    - name: Engine libraries (binaries.lock)
      run: python3 -I -B scripts/fetch-binaries.py
    - name: Build
      run: swift --version && swift build --build-tests -Xswiftc -warnings-as-errors -Xcc -Werror
    - name: Test
      env:
        FILTER: ${{ matrix.filter }}
        SKIP: ${{ matrix.skip }}
      run: python3 -I -B -u ../.github/ci/run-shard.py 2>&1 | tee "$RUNNER_TEMP/test.log"; exit "${PIPESTATUS[0]}"
    - name: Test counts
      if: always()
      run: grep -E "^shard:|Test Suite 'All tests' (passed|failed)" -A1 "$RUNNER_TEMP/test.log" | grep -E "^shard:|Executed" || true
