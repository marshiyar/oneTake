name: bench

# The app's benchmarks from a release build, on every OS, each in its own job: startup (launch to the first painted
# frame), the audio graph (MpvfxAudioBench), the colour grade on the CPU and the GPU (MpvfxColorBench: Vulkan,
# Direct3D 11, Metal), and preview playback and export (MpvfxPreviewBench: 1080p, 4K, stacked, graded, scrub, export).
# .github/ci/bench.py runs each benchmark as separate processes (default 5), records every sample with p50, p95 and max, the peak memory,
# the machine and the commit, prints the table into the job summary and saves bench-<os>.json as the artifact
# bench-<os> (90 days). Runs after a green mpvfx-ci run on main (when main has not moved on since), every Sunday,
# and by hand with a run count.
# GitHub's hosted runners are shared machines with virtual GPUs (lavapipe, WARP, Apple's paravirtual device): the
# numbers are for trends between runs of the same class, never for comparing against a developer's machine.
# Budgets (.github/ci/bench-budgets.json, issue #96): after the benchmarks each job checks its report with bench.py
# --check. A metric's p50 past its ceiling or floor, a budgeted metric missing from the results, or (on a pull request)
# a p50 more than 25% worse than main's latest bench run of the same class (.github/ci/bench_base.py) fails the job,
# with a table of the failed metrics in the job summary. Windows budgets are pending #92 and reported as not checked.
# Separate from mpvfx-ci on purpose: bench is not a required check (whether it becomes one is the owner's call), so a
# red bench job marks the pull request without blocking its merge; it never publishes anything. The linux and macos
# jobs run on OneTake-app/OneTake-actionRunners-1 whenever job runners sends them there, and here only when it does not;
# windows always runs here.

on:
  workflow_run:
    workflows: [mpvfx-ci]
    types: [completed]
    branches: [main]
  # A pull request that touches performance-sensitive code is benchmarked too; agentbot compares it with main.
  pull_request:
    branches: [main]
    paths:
      - 'mpvfx-swift/Sources/MpvfxPlayer/**'
      - 'mpvfx-swift/Sources/MpvfxColor/**'
      - 'mpvfx-swift/Sources/MpvfxMetal/**'
      - 'mpvfx-swift/Sources/CMpvfxVulkan/**'
      - 'mpvfx-swift/Sources/CMpvfxWin32/d3d11_grade.cpp'
      - 'mpvfx-swift/Sources/MpvfxAudio/**'
      - 'mpvfx-swift/Sources/MpvfxAudioGraph/**'
      - 'mpvfx-swift/Sources/MpvfxRuntime/Media/**'
      - 'mpvfx-swift/Sources/MpvfxRuntime/Export/**'
      - 'mpvfx-swift/Sources/OneTakeMedia/**'
      - 'mpvfx-swift/Sources/MpvfxDesktop/main.swift'
      - 'mpvfx-swift/binaries.lock'
      - 'mpvfx-swift/Sources/MpvfxAudioBench/**'
      - 'mpvfx-swift/Sources/MpvfxColorBench/**'
      - 'mpvfx-swift/tools/MpvfxPreviewBench/**'
      - '.github/ci/bench.py'
      - '.github/ci/bench_base.py'
      - '.github/ci/bench-budgets.json'
      - '.github/ci/test_bench.py'
      - '.github/workflows/bench.yml'
  schedule:
    - cron: '20 4 * * 0'
  workflow_dispatch:
    inputs:
      runs:
        description: Processes per benchmark
        type: number
        default: 5
      only:
        description: Comma list of benchmarks to run (startup,audio,grade,preview); empty = all
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: false

env:
  RUNS: ${{ inputs.runs || 5 }}
  ONLY: ${{ inputs.only || '' }}
  XCODE_VERSION: '27.0'

jobs:
  runners:
    # The Linux and macOS benchmarks of main (after green CI, weekly, by hand) and of pull requests from this
    # repository's branches run on the organization OneTake-app's runner pool: a repository_dispatch `onetake-bench` to
    # OneTake-actionRunners-1, which calls bench-source.yml (jobs linux and macos, generated by
    # .github/ci/source_workflows.py) on this commit,
    # keeps the bench-<os> artifacts in its own run, sets the commit status `bench (runners-1)` here and, for a pull
    # request, asks agentbot (repository_dispatch `runners-bench`) to post the comparison with main. linux and macos
    # below are then skipped; windows always runs here. Without both RUNNERS_APP_* secrets (a fork, or before they are set) nothing is sent and they run
    # here; fork pull requests always run here.
    # While Windows and macOS are paused (repository variable LINUX_ONLY not false, mpvfx-ci.yml) nothing is sent and
    # only the Linux benchmark runs, here.
    if: >-
      vars.LINUX_ONLY == 'false' && (
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.sha == github.event.workflow_run.head_sha)
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # the files a pull request changes
    outputs:
      sent: ${{ steps.send.outputs.sent }}
    steps:
      - name: Workflow files this pull request changes
        # OneTake-actionRunners-1 runs bench-source.yml from main, so a pull request that changes the jobs it is made
        # from (or the generator) benchmarks here, with its own definitions.
        id: own
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WATCH: '^\.github/(workflows/bench(-source)?\.yml|ci/source_workflows\.py)$'
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          if grep -qE "$WATCH" "$RUNNER_TEMP/files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::this pull request changes bench.yml, bench-source.yml or source_workflows.py: it benchmarks here"
          fi
      - name: Runners App configured
        id: have
        env:
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
          APP_KEY: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
        # Both secrets, or neither is used: a half-set pair benchmarks here instead of failing the token step.
        run: echo "app=$([ -n "$APP_ID" ] && [ -n "$APP_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Runners App token
        id: token
        if: steps.have.outputs.app == 'true' && steps.own.outputs.changed != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: OneTake-app
          repositories: OneTake-actionRunners-1
          permission-contents: write   # repository_dispatch needs it
      - name: Hand the benchmarks to OneTake-actionRunners-1
        id: send
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.sha }}   # the commit the local jobs would check out (a pull request's merge commit)
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}   # the commit that carries the status
          PR: ${{ github.event.pull_request.number }}
          # main: a run on main (after CI, weekly, or by hand on main), the baseline agentbot compares against.
          KIND: ${{ github.event_name == 'pull_request' && 'pr' || (github.ref == 'refs/heads/main' && 'main' || 'branch') }}
          BENCH_RUNS: ${{ env.RUNS }}
          BENCH_ONLY: ${{ env.ONLY }}
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNERS_APP_ID is not set: the benchmarks run on this repository's runners"
            echo "sent=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg head "$HEAD" --arg kind "$KIND" --arg pr "$PR" \
            --arg runs "$BENCH_RUNS" --arg only "$BENCH_ONLY" --arg run "$RUN" \
            '{event_type: "onetake-bench", client_payload: {repository: $repo, sha: $sha, head: $head, kind: $kind, pr: $pr, runs: $runs, only: $only, run: $run}}' |
            gh api -X POST repos/OneTake-app/OneTake-actionRunners-1/dispatches --input -
          echo "sent=true" >> "$GITHUB_OUTPUT"
          echo "Benchmarks of $SHA run on OneTake-app/OneTake-actionRunners-1 (status: bench (runners-1))" >> "$GITHUB_STEP_SUMMARY"

  linux:
    # workflow_run: only this repository's own push to main (the branches filter matches a fork's branch named main too).
    # Only while main's tip is still the commit that run tested, so a newer, untested commit is never measured and each
    # green commit is measured once.
    # Runs here only when nothing was sent to OneTake-actionRunners-1 (job runners): every benchmark runs in one place.
    # !cancelled(), not always(): cancelling the run still cancels it.
    needs: runners
    if: >-
      !cancelled() && needs.runners.outputs.sent != 'true'
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.sha == github.event.workflow_run.head_sha))
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read   # bench_base.py lists main's bench runs and downloads their artifact
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - name: System packages
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev libpulse-dev \
            xvfb xauth dbus-x11 python3 libvulkan-dev mesa-vulkan-drivers
      # Every event checks out its own commit; after CI on main the job's if: has made sure that is the commit just
      # tested. No ref comes from the workflow_run event, so nothing it names is checked out with this workflow's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # read-only token, and nothing here uses git against origin
      - name: Budget check tests
        working-directory: .
        run: python3 -I -B .github/ci/test_bench.py
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Restore the release build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-release-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            linux-release-${{ github.ref_name }}-
            linux-release-
      - name: Release build
        run: swift --version && swift build -c release
      - name: Benchmarks, Vulkan on lavapipe (a software device; correctness, not GPU speed)
        env:
          MPVFX_GPU: software
        run: |
          python3 -I -B -u ../.github/ci/bench.py --out "$RUNNER_TEMP/bench" --runs "$RUNS" ${ONLY:+--only "$ONLY"} \
            --launcher "xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session --" 2>&1 | tee "$RUNNER_TEMP/bench.log"
          test "${PIPESTATUS[0]}" -eq 0
          cat "$RUNNER_TEMP/bench.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-linux
          path: |
            ${{ runner.temp }}/bench/bench-*.json
            ${{ runner.temp }}/bench/preview.jsonl
            ${{ runner.temp }}/bench.log
          if-no-files-found: ignore
          retention-days: 90
      - name: Main's latest bench report, the baseline of the regression rule (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/ci/bench_base.py bench-linux "$RUNNER_TEMP/bench/bench-linux.json" "$RUNNER_TEMP/bench-main.json"
      - name: Budgets (.github/ci/bench-budgets.json)
        run: |
          set +e   # the shell runs with -e and pipefail: keep the exit code, append the table to the summary, then exit
          python3 -I -B ../.github/ci/bench.py --check "$RUNNER_TEMP/bench/bench-linux.json" --budgets ../.github/ci/bench-budgets.json --strict \
            --baseline "$RUNNER_TEMP/bench-main.json" | tee "$RUNNER_TEMP/budgets.log"
          code=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/budgets.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  windows:
    # workflow_run: only this repository's own push to main (the branches filter matches a fork's branch named main too).
    # Only while main's tip is still the commit that run tested, so a newer, untested commit is never measured and each
    # green commit is measured once.
    # Always here: compnerd/gha-setup-swift is pinned to an untagged commit (allow list), which a generated copy for
    # the runners repository could not carry without a new allow-list entry.
    # Paused with the other Windows and macOS jobs unless the repository variable LINUX_ONLY is false (mpvfx-ci.yml).
    if: vars.LINUX_ONLY == 'false' && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.sha == github.event.workflow_run.head_sha))
    runs-on: windows-2022
    # The full run took 84-86 min before the export scenarios (about 12 min more: 5 runs each of export and
    # export-serial at about 1 min per run); 90 min cancelled it mid-run.
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read   # bench_base.py lists main's bench runs and downloads their artifact
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      # Every event checks out its own commit; after CI on main the job's if: has made sure that is the commit just
      # tested. No ref comes from the workflow_run event, so nothing it names is checked out with this workflow's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # read-only token, and nothing here uses git against origin
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Engine libraries (binaries.lock), DLL folders on PATH
        run: |
          python -I -B scripts/fetch-binaries.py
          for d in .binaries/*/bin; do cygpath -w "$PWD/$d" >> "$GITHUB_PATH"; done
      - name: Restore the release build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: windows-release-${{ github.sha }}
          restore-keys: windows-release-
      - name: Release build
        run: swift --version && swift build -c release
      - name: Benchmarks, Direct3D 11 on WARP (a software device; correctness, not GPU speed)
        env:
          MPVFX_GPU: software
        run: |
          python -I -B -u ../.github/ci/bench.py --out "$RUNNER_TEMP/bench" --runs "$RUNS" ${ONLY:+--only "$ONLY"} 2>&1 | tee "$RUNNER_TEMP/bench.log"
          test "${PIPESTATUS[0]}" -eq 0
          cat "$RUNNER_TEMP/bench.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-windows
          path: |
            ${{ runner.temp }}/bench/bench-*.json
            ${{ runner.temp }}/bench/preview.jsonl
            ${{ runner.temp }}/bench.log
          if-no-files-found: ignore
          retention-days: 90
      - name: Main's latest bench report, the baseline of the regression rule (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -I -B .github/ci/bench_base.py bench-windows "$RUNNER_TEMP/bench/bench-windows.json" "$RUNNER_TEMP/bench-main.json"
      - name: Budgets (.github/ci/bench-budgets.json)
        run: |
          set +e   # the shell runs with -e and pipefail: keep the exit code, append the table to the summary, then exit
          python -I -B ../.github/ci/bench.py --check "$RUNNER_TEMP/bench/bench-windows.json" --budgets ../.github/ci/bench-budgets.json --strict \
            --baseline "$RUNNER_TEMP/bench-main.json" | tee "$RUNNER_TEMP/budgets.log"
          code=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/budgets.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  macos:
    # workflow_run: only this repository's own push to main (the branches filter matches a fork's branch named main too).
    # Only while main's tip is still the commit that run tested, so a newer, untested commit is never measured and each
    # green commit is measured once.
    # Runs here only when nothing was sent to OneTake-actionRunners-1 (job runners): every benchmark runs in one place.
    # !cancelled(), not always(): cancelling the run still cancels it.
    needs: runners
    if: >-
      !cancelled() && vars.LINUX_ONLY == 'false' && needs.runners.outputs.sent != 'true'
      && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.sha == github.event.workflow_run.head_sha))
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read   # bench_base.py lists main's bench runs and downloads their artifact
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      # Every event checks out its own commit; after CI on main the job's if: has made sure that is the commit just
      # tested. No ref comes from the workflow_run event, so nothing it names is checked out with this workflow's token.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # read-only token, and nothing here uses git against origin
      - name: Xcode ${{ env.XCODE_VERSION }}
        run: |
          x=/Applications/Xcode_${XCODE_VERSION}.app
          test -d "$x" || { echo "::error::$x is not on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version && swift --version
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Restore the release build cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: macos27-release-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            macos27-release-${{ github.ref_name }}-
            macos27-release-
      - name: Forget build plans recorded on another runner
        run: |
          rm -rf .build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata .build/out/Intermediates.noindex/XCBuildData/prior-build-descriptions.txt
          rm -rf .build/*.yaml .build/*/*/description.json
      - name: Metal toolchain
        run: sh ../.github/ci/metal-toolchain.sh
      - name: Release build
        run: swift build -c release
      - name: Benchmarks, Metal on the runner's paravirtual GPU
        run: |
          python3 -I -B -u ../.github/ci/bench.py --out "$RUNNER_TEMP/bench" --runs "$RUNS" ${ONLY:+--only "$ONLY"} 2>&1 | tee "$RUNNER_TEMP/bench.log"
          test "${PIPESTATUS[0]}" -eq 0
          cat "$RUNNER_TEMP/bench.log" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bench-macos
          path: |
            ${{ runner.temp }}/bench/bench-*.json
            ${{ runner.temp }}/bench/preview.jsonl
            ${{ runner.temp }}/bench.log
          if-no-files-found: ignore
          retention-days: 90
      - name: Main's latest bench report, the baseline of the regression rule (pull requests)
        if: github.event_name == 'pull_request'
        working-directory: .
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I -B .github/ci/bench_base.py bench-macos "$RUNNER_TEMP/bench/bench-darwin.json" "$RUNNER_TEMP/bench-main.json"
      - name: Budgets (.github/ci/bench-budgets.json)
        run: |
          set +e   # the shell runs with -e and pipefail: keep the exit code, append the table to the summary, then exit
          python3 -I -B ../.github/ci/bench.py --check "$RUNNER_TEMP/bench/bench-darwin.json" --budgets ../.github/ci/bench-budgets.json --strict \
            --baseline "$RUNNER_TEMP/bench-main.json" | tee "$RUNNER_TEMP/budgets.log"
          code=${PIPESTATUS[0]}
          set -e
          cat "$RUNNER_TEMP/budgets.log" >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
