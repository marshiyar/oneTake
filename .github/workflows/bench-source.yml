# GENERATED by .github/ci/source_workflows.py from bench.yml: do not edit; change the source and rerun it.
# Called only by OneTake-app/OneTake-actionRunners-1 to run these jobs on a named oneTake commit on that
# organization's runners: no caches, no secrets, no write token, no token left in the checkouts.
name: bench-source
'on':
  workflow_call:
    inputs:
      runs:
        type: number
        default: 5
      only:
        type: string
        default: ''
      source_repository:
        type: string
        required: true
      source_ref:
        type: string
        required: true
permissions:
  contents: read
env:
  RUNS: ${{ inputs.runs || 5 }}
  ONLY: ${{ inputs.only || '' }}
  XCODE_VERSION: '27.0'
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
    - name: System packages
      working-directory: /
      run: |
        apt-get update -q
        DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
          git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev libpulse-dev \
          xvfb xauth dbus-x11 python3 libvulkan-dev mesa-vulkan-drivers
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: ${{ inputs.source_repository }}
        ref: ${{ inputs.source_ref }}
    - name: Budget check tests
      working-directory: .
      run: python3 -I -B .github/ci/test_bench.py
    - name: Engine libraries (binaries.lock)
      run: python3 -I -B scripts/fetch-binaries.py
    - name: Release build
      run: swift --version && swift build -c release
    - name: Benchmarks, Vulkan on lavapipe (a software device; correctness, not GPU speed)
      env:
        MPVFX_GPU: software
      run: |
        python3 -I -B -u ../.github/ci/bench.py --out "$RUNNER_TEMP/bench" --runs "$RUNS" ${ONLY:+--only "$ONLY"} \
          --launcher "xvfb-run -a -s '-screen 0 1440x900x24' dbus-run-session --" 2>&1 | tee "$RUNNER_TEMP/bench.log"
        test "${PIPESTATUS[0]}" -eq 0
        cat "$RUNNER_TEMP/bench.log" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: bench-linux
        path: |
          ${{ runner.temp }}/bench/bench-*.json
          ${{ runner.temp }}/bench/preview.jsonl
          ${{ runner.temp }}/bench.log
        if-no-files-found: ignore
        retention-days: 90
    - name: Main's latest bench report, the baseline of the regression rule (pull requests)
      if: github.event_name == 'pull_request'
      working-directory: .
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 -I -B .github/ci/bench_base.py bench-linux "$RUNNER_TEMP/bench/bench-linux.json" "$RUNNER_TEMP/bench-main.json"
    - name: Budgets (.github/ci/bench-budgets.json)
      run: |
        set +e   # the shell runs with -e and pipefail: keep the exit code, append the table to the summary, then exit
        python3 -I -B ../.github/ci/bench.py --check "$RUNNER_TEMP/bench/bench-linux.json" --budgets ../.github/ci/bench-budgets.json --strict \
          --baseline "$RUNNER_TEMP/bench-main.json" | tee "$RUNNER_TEMP/budgets.log"
        code=${PIPESTATUS[0]}
        set -e
        cat "$RUNNER_TEMP/budgets.log" >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
  macos:
    runs-on: xcode-27
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: ${{ inputs.source_repository }}
        ref: ${{ inputs.source_ref }}
    - name: Xcode ${{ env.XCODE_VERSION }}
      run: |
        x=/Applications/Xcode_${XCODE_VERSION}.app
        test -d "$x" || { echo "::error::$x is not on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
        sudo xcode-select -s "$x/Contents/Developer"
        xcodebuild -version && swift --version
    - name: Engine libraries (binaries.lock)
      run: python3 -I -B scripts/fetch-binaries.py
    - name: Forget build plans recorded on another runner
      run: |
        rm -rf .build/out/Intermediates.noindex/XCBuildData/*.xcbuilddata .build/out/Intermediates.noindex/XCBuildData/prior-build-descriptions.txt
        rm -rf .build/*.yaml .build/*/*/description.json
    - name: Metal toolchain
      run: sh ../.github/ci/metal-toolchain.sh
    - name: Release build
      run: swift build -c release
    - name: Benchmarks, Metal on the runner's paravirtual GPU
      run: |
        python3 -I -B -u ../.github/ci/bench.py --out "$RUNNER_TEMP/bench" --runs "$RUNS" ${ONLY:+--only "$ONLY"} 2>&1 | tee "$RUNNER_TEMP/bench.log"
        test "${PIPESTATUS[0]}" -eq 0
        cat "$RUNNER_TEMP/bench.log" >> "$GITHUB_STEP_SUMMARY"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      if: always()
      with:
        name: bench-macos
        path: |
          ${{ runner.temp }}/bench/bench-*.json
          ${{ runner.temp }}/bench/preview.jsonl
          ${{ runner.temp }}/bench.log
        if-no-files-found: ignore
        retention-days: 90
    - name: Main's latest bench report, the baseline of the regression rule (pull requests)
      if: github.event_name == 'pull_request'
      working-directory: .
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 -I -B .github/ci/bench_base.py bench-macos "$RUNNER_TEMP/bench/bench-darwin.json" "$RUNNER_TEMP/bench-main.json"
    - name: Budgets (.github/ci/bench-budgets.json)
      run: |
        set +e   # the shell runs with -e and pipefail: keep the exit code, append the table to the summary, then exit
        python3 -I -B ../.github/ci/bench.py --check "$RUNNER_TEMP/bench/bench-darwin.json" --budgets ../.github/ci/bench-budgets.json --strict \
          --baseline "$RUNNER_TEMP/bench-main.json" | tee "$RUNNER_TEMP/budgets.log"
        code=${PIPESTATUS[0]}
        set -e
        cat "$RUNNER_TEMP/budgets.log" >> "$GITHUB_STEP_SUMMARY"
        exit "$code"
