# GENERATED by .github/ci/source_workflows.py from codeql.yml: do not edit; change the source and rerun it.
# Called only by OneTake-app/OneTake-actionRunners-1 to run these jobs on a named oneTake commit on that
# organization's runners: no caches, no secrets, no write token, no token left in the checkouts.
name: codeql-swift-source
'on':
  workflow_call:
    inputs:
      source_repository:
        type: string
        required: true
      source_ref:
        type: string
        required: true
permissions:
  contents: read
jobs:
  swift:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: '26.6'
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        repository: ${{ inputs.source_repository }}
        ref: ${{ inputs.source_ref }}
    - name: Xcode ${{ env.XCODE_VERSION }} (Swift 6.3)
      run: |
        x=/Applications/Xcode_${XCODE_VERSION}.app
        test -d "$x" || { echo "::error::$x is not on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
        sudo xcode-select -s "$x/Contents/Developer"
        xcodebuild -version && swift --version
        swift --version 2>&1 | grep -q 'Swift version 6\.3' || { echo "::error::CodeQL supports Swift up to 6.3.x; Xcode $XCODE_VERSION is not on 6.3"; exit 1; }
    - name: Engine libraries (binaries.lock)
      run: python3 -I -B scripts/fetch-binaries.py
    - name: Metal toolchain
      run: sh ../.github/ci/metal-toolchain.sh
    - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: swift
        build-mode: manual
        queries: security-and-quality
    - name: Build under the CodeQL tracer
      run: swift build --disable-sandbox --triple arm64-apple-macosx15.0
    - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        category: /language:swift
        upload: never
        output: ${{ runner.temp }}/sarif
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: sarif-swift
        path: ${{ runner.temp }}/sarif/*.sarif
        if-no-files-found: error
        retention-days: 7
