name: codeql

# GitHub's code scanning on the three kinds of code this repository holds: the Swift app (built in the Linux CI
# container with the pinned engine libraries, as mpvfx-ci does), the Python scripts behind CI and packaging, and the workflow
# files themselves (the `actions` language: injection, unpinned actions, token scope). Results land under Security >
# Code scanning. Runs on pull requests, pushes to main and weekly; separate from mpvfx-ci and never a required check.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true


jobs:
  scripts-and-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  swift:
    # On Linux in the CI's own Swift 6.3.3 container: CodeQL supports Swift up to 6.3.3, and the macOS runners ship 6.4.
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - name: System packages
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev libpulse-dev \
            python3 libvulkan-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build under the CodeQL tracer
        run: swift build
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:swift
