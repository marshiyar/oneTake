name: codeql

# GitHub's code scanning on the three kinds of code this repository holds: the Swift app (built on the macOS runner
# with the pinned engine libraries, as mpvfx-ci does), the Python scripts behind CI and packaging, and the workflow
# files themselves (the `actions` language: injection, unpinned actions, token scope). Results land under Security >
# Code scanning. Runs on pull requests, pushes to main and weekly; separate from mpvfx-ci and never a required check.
# The Swift analysis (codeql-swift.yml) of main and of this repository's pull requests runs on OneTake-app's runner
# pool (job swift-runners); python and actions always run here.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true


jobs:
  scripts-and-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  swift-runners:
    # A push to main or a pull request from one of this repository's branches sends its Swift analysis to the
    # organization OneTake-app's runner pool (a repository_dispatch `onetake-codeql-swift` to OneTake-actionRunners-1),
    # which calls codeql-swift.yml on this commit and uploads the SARIF file to this repository's code scanning with
    # the oneTake-Runners1 App, then sets the commit status `codeql swift (runners-1)`. The swift job below is then
    # skipped: the analysis runs in exactly one place. Without both RUNNERS_APP_* secrets (a fork, or before they are
    # set) nothing is sent and swift runs here, as it does for the weekly run and a dispatch.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sent: ${{ steps.send.outputs.sent }}
    steps:
      - name: Runners App configured
        id: have
        env:
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
          APP_KEY: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
        # Both secrets, or neither is used: a half-set pair analyses here instead of failing the token step.
        run: echo "app=$([ -n "$APP_ID" ] && [ -n "$APP_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Runners App token
        id: token
        if: steps.have.outputs.app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: OneTake-app
          repositories: OneTake-actionRunners-1
          permission-contents: write   # repository_dispatch needs it
      - name: Hand the Swift analysis to OneTake-actionRunners-1
        id: send
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.sha }}   # the commit analysed: main's push, or the pull request's merge commit
          REF: ${{ github.ref }}   # refs/heads/main or refs/pull/<n>/merge: where code scanning files the results
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}   # the commit that carries the status
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNERS_APP_ID is not set: the Swift analysis runs on this repository's runners"
            echo "sent=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg ref "$REF" --arg head "$HEAD" --arg run "$RUN" \
            '{event_type: "onetake-codeql-swift", client_payload: {repository: $repo, sha: $sha, ref: $ref, head: $head, run: $run}}' |
            gh api -X POST repos/OneTake-app/OneTake-actionRunners-1/dispatches --input -
          echo "sent=true" >> "$GITHUB_OUTPUT"
          echo "Swift analysis of $SHA runs on OneTake-app/OneTake-actionRunners-1 (status: codeql swift (runners-1))" >> "$GITHUB_STEP_SUMMARY"

  swift:
    # The local fallback: only when nothing was sent above (skipped, failed, or no App secrets).
    needs: swift-runners
    if: always() && needs.swift-runners.outputs.sent != 'true'
    uses: ./.github/workflows/codeql-swift.yml
    permissions:
      contents: read

  swift-upload:
    # codeql-swift.yml never uploads; this job, which runs none of the repository's code, does.
    needs: swift
    if: always() && needs.swift.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # upload-sarif reads the checkout's commit; nothing uses git against origin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sarif-swift
          path: ${{ runner.temp }}/sarif
      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ runner.temp }}/sarif
          category: /language:swift
