name: codeql

# GitHub's code scanning on the three kinds of code this repository holds: the Swift app (built on the macOS runner
# with the pinned engine libraries, as mpvfx-ci does), the Python scripts behind CI and packaging, and the workflow
# files themselves (the `actions` language: injection, unpinned actions, token scope). Results land under Security >
# Code scanning. Runs on pull requests, pushes to main and weekly; separate from mpvfx-ci and never a required check.
# The Swift analysis of main and of this repository's pull requests runs on OneTake-app's runner
# pool (job swift-runners); python and actions always run here.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true


jobs:
  scripts-and-workflows:
    # Repository variable CODEQL_PAUSED=true (owner ruling 2026-10-21) pauses every CodeQL job to free the runners;
    # CODEQL_PAUSED=false brings them back. Nothing is deleted.
    if: vars.CODEQL_PAUSED != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  swift-runners:
    # A push to main or a pull request from one of this repository's branches sends its Swift analysis to the
    # organization OneTake-app's runner pool (a repository_dispatch `onetake-codeql-swift` to OneTake-actionRunners-1),
    # which calls codeql-swift-source.yml (the swift job below, generated) on this commit and uploads the SARIF file to this repository's code scanning with
    # the oneTake-Runners1 App, then sets the commit status `codeql swift (runners-1)`. The swift job below is then
    # skipped: the analysis runs in exactly one place. Without both RUNNERS_APP_* secrets (a fork, or before they are
    # set) nothing is sent and swift runs here, as it does for the weekly run and a dispatch.
    if: >-
      vars.CODEQL_PAUSED != 'true' && (
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # the files a pull request changes
    outputs:
      sent: ${{ steps.send.outputs.sent }}
    steps:
      - name: Workflow files this pull request changes
        # OneTake-actionRunners-1 runs codeql-swift-source.yml from main, so a pull request that changes the swift job
        # (or the generator) is analysed here, with its own definition.
        id: own
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WATCH: '^\.github/(workflows/codeql(-swift-source)?\.yml|ci/source_workflows\.py)$'
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          if grep -qE "$WATCH" "$RUNNER_TEMP/files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::this pull request changes codeql.yml, codeql-swift-source.yml or source_workflows.py: it is analysed here"
          fi
      - name: Runners App configured
        id: have
        env:
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
          APP_KEY: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
        # Both secrets, or neither is used: a half-set pair analyses here instead of failing the token step.
        run: echo "app=$([ -n "$APP_ID" ] && [ -n "$APP_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Runners App token
        id: token
        if: steps.have.outputs.app == 'true' && steps.own.outputs.changed != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: OneTake-app
          repositories: OneTake-actionRunners-1
          permission-contents: write   # repository_dispatch needs it
      - name: Hand the Swift analysis to OneTake-actionRunners-1
        id: send
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.sha }}   # the commit analysed: main's push, or the pull request's merge commit
          REF: ${{ github.ref }}   # refs/heads/main or refs/pull/<n>/merge: where code scanning files the results
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}   # the commit that carries the status
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNERS_APP_ID is not set: the Swift analysis runs on this repository's runners"
            echo "sent=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg ref "$REF" --arg head "$HEAD" --arg run "$RUN" \
            '{event_type: "onetake-codeql-swift", client_payload: {repository: $repo, sha: $sha, ref: $ref, head: $head, run: $run}}' |
            gh api -X POST repos/OneTake-app/OneTake-actionRunners-1/dispatches --input -
          echo "sent=true" >> "$GITHUB_OUTPUT"
          echo "Swift analysis of $SHA runs on OneTake-app/OneTake-actionRunners-1 (status: codeql swift (runners-1))" >> "$GITHUB_STEP_SUMMARY"

  swift:
    # Runs here only when nothing was sent above (skipped, failed, or no App secrets): the analysis runs in one place.
    # !cancelled(), not always(): a newer run's cancel-in-progress still cancels it.
    # OneTake-actionRunners-1 runs this same job from codeql-swift-source.yml, which .github/ci/source_workflows.py
    # generates from it (no upload there: the runners repository uploads the SARIF file with its App).
    needs: swift-runners
    if: ${{ !cancelled() && vars.CODEQL_PAUSED != 'true' && needs.swift-runners.outputs.sent != 'true' }}
    # CodeQL's Swift extractor runs only on macOS (the action and the extractor both refuse Linux) and supports Swift up
    # to 6.3.x. The xcode-27 image only has Xcode 27 (Swift 6.4), so this job uses the macos-26 image, whose Xcode 26.x
    # carries Swift 6.3; the step below fails loudly if the selected Xcode is not on 6.3.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    env:
      XCODE_VERSION: '26.6'
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false   # nothing here uses git against origin
      - name: Xcode ${{ env.XCODE_VERSION }} (Swift 6.3)
        run: |
          x=/Applications/Xcode_${XCODE_VERSION}.app
          test -d "$x" || { echo "::error::$x is not on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version && swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.3' || { echo "::error::CodeQL supports Swift up to 6.3.x; Xcode $XCODE_VERSION is not on 6.3"; exit 1; }
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Metal toolchain
        run: sh ../.github/ci/metal-toolchain.sh
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build under the CodeQL tracer
        # The tracer starts SwiftPM as x86_64 (Rosetta), which then builds for x86_64 and cannot link the arm64 engine
        # libraries (job 118341253370), so the target is pinned to the runner's arm64. --disable-sandbox: under the
        # tracer SwiftPM's sandbox-exec for the manifest fails with "Bad CPU type in executable" (job 118273895982);
        # the sandbox only wraps the manifest and plugins, not what is analysed.
        run: swift build --disable-sandbox --triple arm64-apple-macosx15.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:swift
