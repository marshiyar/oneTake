name: codeql

# GitHub's code scanning on the three kinds of code this repository holds: the Swift app (built on the macOS runner
# with the pinned engine libraries, as mpvfx-ci does), the Python scripts behind CI and packaging, and the workflow
# files themselves (the `actions` language: injection, unpinned actions, token scope). Results land under Security >
# Code scanning. Runs on pull requests, pushes to main and weekly; separate from mpvfx-ci and never a required check.

on:
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**']
  schedule:
    - cron: '35 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true


jobs:
  scripts-and-workflows:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:${{ matrix.language }}

  swift:
    # CodeQL's Swift extractor runs only on macOS (the action and the extractor both refuse Linux) and supports Swift up
    # to 6.3.x. The xcode-27 image only has Xcode 27 (Swift 6.4), so this job uses the macos-26 image, whose Xcode 26.x
    # carries Swift 6.3; the step below fails loudly if the selected Xcode is not on 6.3.
    runs-on: macos-26
    timeout-minutes: 90
    permissions:
      contents: read
      security-events: write
    env:
      XCODE_VERSION: '26.6'
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Xcode ${{ env.XCODE_VERSION }} (Swift 6.3)
        run: |
          x=/Applications/Xcode_${XCODE_VERSION}.app
          test -d "$x" || { echo "::error::$x is not on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version && swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.3' || { echo "::error::CodeQL supports Swift up to 6.3.x; Xcode $XCODE_VERSION is not on 6.3"; exit 1; }
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Metal toolchain
        run: sh ../.github/ci/metal-toolchain.sh
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build under the CodeQL tracer
        # The tracer starts SwiftPM as x86_64 (Rosetta), which then builds for x86_64 and cannot link the arm64 engine
        # libraries (job 118341253370), so the target is pinned to the runner's arm64. --disable-sandbox: under the
        # tracer SwiftPM's sandbox-exec for the manifest fails with "Bad CPU type in executable" (job 118273895982);
        # the sandbox only wraps the manifest and plugins, not what is analysed.
        run: swift build --disable-sandbox --triple arm64-apple-macosx15.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:swift
