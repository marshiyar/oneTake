name: quality-ratchets

# Code-quality counts that may only go down. crash-constructs (.github/ci/crash_constructs.py): force unwraps, try!,
# as!, fatalError and precondition per Swift file under mpvfx-swift/Sources, against the committed baseline
# .github/ci/crash-constructs-baseline.json; a file with more of a kind than its baseline fails, with file:line for each
# new one (judged against the parent commit: the base branch for a pull request's merge commit, the previous main for
# a push). Lowering a count and running `--update` is how the baseline moves. Also runs the unit tests of the advisory
# pr-hygiene script, whose own workflow runs only the base branch's copy. Separate from mpvfx-ci; not a required check.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-ratchets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  crash-constructs:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parent commit too: the base each new occurrence is told apart from.
          fetch-depth: 2
          persist-credentials: false
      - name: The scripts' own tests
        run: |
          python3 -I -B .github/ci/test_crash_constructs.py
          python3 -I -B .github/ci/test_pr_hygiene.py
      - name: Crash constructs per file against the baseline
        run: python3 -I -B .github/ci/crash_constructs.py --base HEAD^1
