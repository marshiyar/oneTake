name: linux-optional-headers

# The Linux build on a machine without the optional development headers. Package.swift adds CMpvfxVulkan only when
# /usr/include/vulkan/vulkan.h exists (libvulkan-dev) and CPulse only when /usr/include/pulse/simple.h exists
# (libpulse-dev); without them MpvfxColor grades on the CPU and MpvfxAudio has no PulseAudio sink, and every target
# must still build. mpvfx-ci always installs both, so it never sees code that uses a Vulkan or PulseAudio type outside
# `#if canImport(...)` (issue #78). This job installs every other build dependency mpvfx-ci's linux job does, makes
# sure neither header is on the machine, and builds every target and every test target with warnings as errors.
# Separate from mpvfx-ci and not a required check: it stays red on main until #78 lands, then guards the regression.

on:
  pull_request:
    branches: [main]
    paths:
      - 'mpvfx-swift/Package.swift'
      - 'mpvfx-swift/Package.resolved'
      - 'mpvfx-swift/binaries.lock'
      - 'mpvfx-swift/Sources/**'
      - 'mpvfx-swift/Tests/**'
      - 'mpvfx-swift/tools/**'
      - '.github/workflows/linux-optional-headers.yml'
  push:
    branches: [main]
    paths:
      - 'mpvfx-swift/Package.swift'
      - 'mpvfx-swift/Package.resolved'
      - 'mpvfx-swift/binaries.lock'
      - 'mpvfx-swift/Sources/**'
      - 'mpvfx-swift/Tests/**'
      - 'mpvfx-swift/tools/**'
      - '.github/workflows/linux-optional-headers.yml'
  schedule:
    - cron: '23 5 * * 4'   # weekly, for toolchain image drift on an unchanged main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-optional-headers-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runners:
    # This build runs on the organization OneTake-app's runner pool: a repository_dispatch `onetake-linux-optional-headers` to
    # OneTake-actionRunners-1, which calls linux-optional-headers-source.yml (the build job below, generated by
    # .github/ci/source_workflows.py) on this commit and sets the commit status `linux-optional-headers build (runners-1)` here. build is
    # then skipped, so it runs in one place. Without both RUNNERS_APP_* secrets (a fork, or before they are set)
    # nothing is sent and build runs here; fork pull requests always build here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read   # the files a pull request changes
    outputs:
      sent: ${{ steps.send.outputs.sent }}
    steps:
      - name: Workflow files this pull request changes
        # OneTake-actionRunners-1 runs linux-optional-headers-source.yml from main, so a pull request that changes the build job (or the
        # generator) builds here, with its own definition.
        id: own
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          WATCH: '^\.github/(workflows/linux-optional-headers(-source)?\.yml|ci/source_workflows\.py)$'
        run: |
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          if grep -qE "$WATCH" "$RUNNER_TEMP/files.txt"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::this pull request changes linux-optional-headers.yml, linux-optional-headers-source.yml or source_workflows.py: it builds here"
          fi
      - name: Runners App configured
        id: have
        env:
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
          APP_KEY: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
        # Both secrets, or neither is used: a half-set pair builds here instead of failing the token step.
        run: echo "app=$([ -n "$APP_ID" ] && [ -n "$APP_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Runners App token
        id: token
        if: steps.have.outputs.app == 'true' && steps.own.outputs.changed != 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: OneTake-app
          repositories: OneTake-actionRunners-1
          permission-contents: write   # repository_dispatch needs it
      - name: Hand the build to OneTake-actionRunners-1
        id: send
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.sha }}   # the commit build would check out (a pull request's merge commit)
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}   # the commit that carries the status
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNERS_APP_ID is not set: the build runs on this repository's runners"
            echo "sent=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg head "$HEAD" --arg run "$RUN" \
            '{event_type: "onetake-linux-optional-headers", client_payload: {repository: $repo, sha: $sha, head: $head, run: $run}}' |
            gh api -X POST repos/OneTake-app/OneTake-actionRunners-1/dispatches --input -
          echo "sent=true" >> "$GITHUB_OUTPUT"
          echo "The build of $SHA runs on OneTake-app/OneTake-actionRunners-1 (status: linux-optional-headers build (runners-1))" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: linux build without Vulkan and PulseAudio headers
    # Runs here only when nothing was sent to OneTake-actionRunners-1 (job runners): the build runs in one place.
    needs: runners
    # !cancelled(), not always(): a newer run's cancel-in-progress still cancels it.
    if: ${{ !cancelled() && needs.runners.outputs.sent != 'true' }}
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - name: System packages (mpvfx-ci's linux list without libvulkan-dev and libpulse-dev)
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev python3
      - name: The optional headers are not on the machine
        working-directory: /
        run: |
          # Fail closed: if a dependency ever pulls a header in, hide it, so the build below still tests the
          # configuration Package.swift promises, and say so.
          for h in /usr/include/vulkan/vulkan.h /usr/include/pulse/simple.h; do
            if [ -e "$h" ]; then
              d=$(dirname "$h")
              echo "::warning::$h was installed by a dependency; moved $d aside for this build"
              mv "$d" "$d.hidden"
            fi
            if [ -e "$h" ]; then echo "::error::$h is still present"; exit 1; fi
            echo "absent: $h"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Restore caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          # Its own key prefix: a .build from a configuration with CMpvfxVulkan and CPulse is not reused here.
          key: linux-noheaders-debug-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            linux-noheaders-debug-${{ github.ref_name }}-
            linux-noheaders-debug-
      - name: Manifest without the optional targets
        run: |
          swift package dump-package > "$RUNNER_TEMP/package.json"
          python3 -I -B - "$RUNNER_TEMP/package.json" <<'PY'
          import json, sys
          names = {t["name"] for t in json.load(open(sys.argv[1]))["targets"]}
          present = sorted(names & {"CVulkan", "CMpvfxVulkan", "CPulse"})
          if present:
              sys.exit(f"::error::the manifest still declares {present}: the headers were found")
          print(f"{len(names)} targets, none of CVulkan, CMpvfxVulkan, CPulse")
          PY
      - name: Build every target and test target (warnings are errors, as in mpvfx-ci)
        run: swift --version && swift build --build-tests -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Save caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-noheaders-debug-${{ github.ref_name }}-${{ github.sha }}
