name: sentinel

# The in-house behaviour check (.github/ci/sentinel.py): what a video editor has no business doing, found in the
# repository or in what it ships. `repo` runs on every pull request and push: sources, scripts, workflows, tracked
# files and binaries.lock. `artifact` runs after each mpvfx-ci run that built installers (or by hand for a run id),
# one job per OS: unpacks the installers as a user would and reads every binary's imports against the forbidden sets
# and the recorded baseline (.github/sentinel-baseline/<binary>.imports); a new import since the last release is a
# finding, and the run's sentinel-imports-<os> artifact holds the current lists to commit when the change is wanted.
# The artifact jobs run from the default branch, so they read main's baseline files: a pull request that changes an
# import is judged against the old list until it is merged. Allow list with reasons: .github/sentinel.toml. Separate from mpvfx-ci; never a required check.

on:
  pull_request:
  push:
    branches: [main]
  workflow_run:
    workflows: [mpvfx-ci]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: The mpvfx-ci run whose installer artifacts to check (empty = repository check only)
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: sentinel-${{ github.event.workflow_run.id || inputs.run_id || github.ref }}
  cancel-in-progress: false

env:
  RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}

jobs:
  repo:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.run_id == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The scanner's own tests
        run: python3 -I -B .github/ci/test_sentinel.py
      - name: Sources, scripts, workflows, files and binaries.lock
        run: python3 -I -B .github/ci/sentinel.py repo | tee -a "$GITHUB_STEP_SUMMARY"

  linux:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.run_id != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: linux
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Unpack
        run: |
          mkdir -p unpacked/portable unpacked/deb
          tar -xzf dist/mpvfx-linux-x64-*.tar.gz -C unpacked/portable
          dpkg-deb -x dist/mpvfx_*.deb unpacked/deb
      - name: Imports of every shipped binary
        run: python3 -I -B .github/ci/sentinel.py artifact --baseline .github/sentinel-baseline --write-imports "$RUNNER_TEMP/imports" unpacked | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sentinel-imports-linux
          path: ${{ runner.temp }}/imports/*.imports
          if-no-files-found: ignore

  windows:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.run_id != '')
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: windows
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Unpack
        run: |
          mkdir -p unpacked/portable unpacked/setup unpacked/installer
          unzip -q dist/mpvfx-windows-x64-*.zip -d unpacked/portable
          cp dist/MpVFX-*-setup.exe unpacked/installer/MpVFX-setup.exe
          7z x -y -ounpacked/setup dist/MpVFX-*-setup.exe >/dev/null || { echo "::error::7z could not unpack setup.exe"; exit 1; }
      - name: Imports of every shipped binary (the Swift and MSVC runtimes are skipped)
        run: python3 -I -B .github/ci/sentinel.py artifact --baseline .github/sentinel-baseline --write-imports "$RUNNER_TEMP/imports" unpacked | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sentinel-imports-windows
          path: ${{ runner.temp }}/imports/*.imports
          if-no-files-found: ignore

  macos:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.run_id != '')
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: .github
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: macos
          path: dist
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Mount the disk image and copy the app out
        run: |
          dmg=$(ls dist/MpVFX-*.dmg)
          mnt=$(mktemp -d); hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg"
          mkdir -p unpacked; cp -R "$mnt/MpVFX.app" unpacked/; hdiutil detach "$mnt"
      - name: Imports of every shipped binary
        run: python3 -I -B .github/ci/sentinel.py artifact --baseline .github/sentinel-baseline --write-imports "$RUNNER_TEMP/imports" unpacked | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: sentinel-imports-macos
          path: ${{ runner.temp }}/imports/*.imports
          if-no-files-found: ignore
