# One automatic re-run when a pull request's mpvfx-ci failed only because remote test shards never reported.
#
# remote-shards waits for the commit statuses OneTake-app/OneTake-actionRunners-1 posts for its shards; when that
# organization's runners are saturated the wait ends with "did not report a result" and ci-ok fails although no test
# failed. This workflow re-runs the failed jobs of that run once (attempt 1 only), and only when:
#   - every failed job is remote-shards or ci-ok,
#   - remote-shards' log names a shard that did not report (a shard that reported a failure is a real failure),
#   - the run's commit is still the pull request's head (a replaced commit is not re-run).
# It reads the API only and never checks out or runs a pull request's code.
name: remote-rerun

on:
  workflow_run:   # zizmor: ignore[dangerous-triggers] reads job results and logs only; runs nothing from the PR
    workflows: [mpvfx-ci]
    types: [completed]

permissions: {}

concurrency:
  group: remote-rerun-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  rerun:
    if: >-
      github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write        # read the jobs and logs, re-run the failed jobs
      pull-requests: read   # the pull request's current head
    steps:
      - name: Re-run when only unreported remote shards failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          OWNER: ${{ github.event.workflow_run.head_repository.owner.login }}
        run: |
          set -euo pipefail
          jobs=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/1/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled" or .conclusion == "timed_out") | [.id, .name] | @tsv')
          echo "$jobs"
          [ -n "$jobs" ] || { echo "no failed job"; exit 0; }
          other=$(awk -F'\t' '$2 != "remote-shards" && $2 != "ci-ok"' <<< "$jobs")
          [ -z "$other" ] || { echo "other jobs failed: not a remote wait"; exit 0; }
          shards=$(awk -F'\t' '$2 == "remote-shards" { print $1 }' <<< "$jobs")
          [ -n "$shards" ] || { echo "remote-shards did not fail"; exit 0; }
          gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$shards/logs" > "$RUNNER_TEMP/shards.log"
          grep -q "did not report a result" "$RUNNER_TEMP/shards.log" || { echo "a shard reported a failure: real"; exit 0; }
          ! grep -q "::error::.* ended " "$RUNNER_TEMP/shards.log" || { echo "a shard reported a failure: real"; exit 0; }
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls?head=$OWNER:$BRANCH&state=open" --jq '.[0].head.sha // ""')
          [ "$head" = "$SHA" ] || { echo "$SHA is no longer the pull request head ($head)"; exit 0; }
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/rerun-failed-jobs"
          echo "re-ran the failed jobs of run $RUN (remote shards did not report)" >> "$GITHUB_STEP_SUMMARY"
