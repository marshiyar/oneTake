# Stale in-progress issues return to the ready queue (.github/ci/stale_in_progress.py): once a day, an open issue
# labelled `in-progress` that no open pull request links (title, body or head branch names it) and whose labels have
# not changed for 48 hours gains `buildable` (a `blocked` one loses it instead), gets one comment saying why, and
# loses `in-progress` last. Issues labelled `launch-blocker` or `needs-owner` are never touched.
#
# Run by hand (workflow_dispatch) it is a dry run unless dry_run is turned off: it lists what it would change and
# writes nothing. Nothing from a pull request runs here: main is checked out, without credentials, and pull requests
# are only read through the API.
name: stale-in-progress

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: List what would change; write nothing
        required: false
        type: boolean
        default: true

permissions: {}

concurrency:
  group: stale-in-progress
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read         # actions/checkout of main (the script); nothing is pushed
      issues: write          # remove in-progress, add buildable, comment
      pull-requests: read    # list open pull requests to find the ones that link an issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: .github/ci
      - name: The job's own tests
        run: python3 -I -B .github/ci/test_stale_in_progress.py
      - name: Return stale in-progress issues to the queue
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          set -o pipefail
          python3 -I -B .github/ci/stale_in_progress.py | tee -a "$GITHUB_STEP_SUMMARY"
