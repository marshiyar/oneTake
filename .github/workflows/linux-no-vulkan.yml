name: linux-no-vulkan

# The package on a Linux machine without the Vulkan headers (issue #78). Package.swift adds CMpvfxVulkan only when
# /usr/include/vulkan/vulkan.h exists, and MpvfxColor then grades on the CPU; mpvfx-ci.yml always installs the headers,
# so only this job sees that build. It builds every target and test, runs MpvfxColorBench (GPU unavailable, CPU timed,
# exit 0) and scans Sources/ and tools/ for a Vulkan type outside `#if canImport(CMpvfxVulkan)` (.github/ci/vulkan-guard.py).

on:
  pull_request:
    branches: [main]
    paths:
      - 'mpvfx-swift/Package.swift'
      - 'mpvfx-swift/Package.resolved'
      - 'mpvfx-swift/binaries.lock'
      - 'mpvfx-swift/Sources/**'
      - 'mpvfx-swift/Tests/**'
      - 'mpvfx-swift/tools/**'
      - '.github/ci/vulkan-guard.py'
      - '.github/ci/test_vulkan_guard.py'
      - '.github/workflows/linux-no-vulkan.yml'
  push:
    branches: [main]
    paths-ignore: ['**/*.md', '**/docs/**', '.gitignore']
  schedule:
    - cron: '43 6 * * *'   # nightly: catches a runner image or base image that starts shipping the headers
  workflow_dispatch:

concurrency:
  group: linux-no-vulkan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guard:
    # The source scan and its tests; no Swift build.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: vulkan-guard tests
        run: python3 -I -B .github/ci/test_vulkan_guard.py
      - name: No Vulkan type outside canImport(CMpvfxVulkan)
        run: python3 -I -B .github/ci/vulkan-guard.py mpvfx-swift

  runners:
    # This build runs on the organization OneTake-app's runner pool: a repository_dispatch `onetake-linux-no-vulkan` to
    # OneTake-actionRunners-1, which calls linux-no-vulkan-source.yml (the build job below, generated by
    # .github/ci/source_workflows.py) on this commit and sets the commit status `linux-no-vulkan build (runners-1)` here. build is
    # then skipped, so it runs in one place. Without both RUNNERS_APP_* secrets (a fork, or before they are set)
    # nothing is sent and build runs here; fork pull requests always build here.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sent: ${{ steps.send.outputs.sent }}
    steps:
      - name: Runners App configured
        id: have
        env:
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
          APP_KEY: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
        # Both secrets, or neither is used: a half-set pair builds here instead of failing the token step.
        run: echo "app=$([ -n "$APP_ID" ] && [ -n "$APP_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Runners App token
        id: token
        if: steps.have.outputs.app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: OneTake-app
          repositories: OneTake-actionRunners-1
          permission-contents: write   # repository_dispatch needs it
      - name: Hand the build to OneTake-actionRunners-1
        id: send
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.sha }}   # the commit build would check out (a pull request's merge commit)
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}   # the commit that carries the status
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNERS_APP_ID is not set: the build runs on this repository's runners"
            echo "sent=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg head "$HEAD" --arg run "$RUN" \
            '{event_type: "onetake-linux-no-vulkan", client_payload: {repository: $repo, sha: $sha, head: $head, run: $run}}' |
            gh api -X POST repos/OneTake-app/OneTake-actionRunners-1/dispatches --input -
          echo "sent=true" >> "$GITHUB_OUTPUT"
          echo "The build of $SHA runs on OneTake-app/OneTake-actionRunners-1 (status: linux-no-vulkan build (runners-1))" >> "$GITHUB_STEP_SUMMARY"

  build:
    runs-on: ubuntu-24.04
    # Runs here only when nothing was sent to OneTake-actionRunners-1 (job runners): the build runs in one place.
    needs: runners
    if: always() && needs.runners.outputs.sent != 'true'
    container: swift:6.3.3-noble
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - name: System packages (mpvfx-ci.yml's Linux set, Vulkan headers left out)
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev libpulse-dev python3
      - name: Hide the Vulkan headers if any package brought them
        working-directory: /
        run: |
          if [ -e /usr/include/vulkan ]; then mv /usr/include/vulkan /usr/include/vulkan.hidden-by-ci; fi
          test ! -e /usr/include/vulkan/vulkan.h
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Restore caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-no-vulkan-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            linux-no-vulkan-${{ github.ref_name }}-
            linux-no-vulkan-
      - name: Toolchain version
        run: swift --version
      - name: Build every target and test without the Vulkan headers
        run: swift build --build-tests -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: MpvfxColorBench reports no GPU and times the CPU path
        run: |
          swift run --skip-build MpvfxColorBench 1 2>&1 | tee "$RUNNER_TEMP/bench.log"
          test "${PIPESTATUS[0]}" -eq 0
          grep -q "GPU compute renderer unavailable" "$RUNNER_TEMP/bench.log"
          grep -q "| 1920x1080 |" "$RUNNER_TEMP/bench.log"
      - name: Save caches
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-no-vulkan-${{ github.ref_name }}-${{ github.sha }}
