name: mpvfx-ci

# The app on Linux and Windows (a build, package and install + launch job per OS beside its test shards) and on macOS
# through mpvfx-macos.yml (job macos). Runs on every pull request into main, every push to main, every night and every
# push of a v* tag; Linux and Windows publish as soon as they pass and macOS joins the same release later
# (.github/ci/publish.sh): a run of main as the prerelease nightly-<commit>, a v* tag as the official release of that
# tag, marked latest. Pull requests and other branches never publish.
#
# The media and keyframe engines are not built here: every job downloads the prebuilt libraries pinned in
# mpvfx-swift/binaries.lock (scripts/fetch-binaries.py checks each SHA-256) from public releases. No repository secret
# is used by this workflow.
#
# Work already done on identical inputs is not repeated: a test shard runs only when its key (.github/ci/test-shards.py:
# the files its tests are built from, binaries.lock included) has no pass recorded on that OS. The nightly run and a
# dispatch with full_tests run everything.

on:
  # No paths filter on pull requests: ci-ok is the required check, and a workflow skipped by a paths filter leaves it
  # pending forever.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    # An official release: the tag's version must equal mpvfx-swift/packaging/VERSION. Path filters do not apply to tag
    # pushes, so every v* tag runs the full build.
    tags: ['v*']
    paths-ignore: ['**/*.md', '**/docs/**', '.gitignore']
  # The merge queue tests each queued pull request on top of the ones ahead of it; ci-ok is the check it waits for.
  merge_group:
    types: [checks_requested]
  schedule:
    - cron: '17 6 * * *'   # nightly, 06:17 UTC: catches runner image and toolchain drift on an unchanged main
  workflow_dispatch:
    inputs:
      full_tests:
        description: Run every test shard, ignoring passes recorded for unchanged inputs
        type: boolean
        default: false
      publish:
        description: Publish the installers when every job passes (codex-apply starts its runs with false)
        type: boolean
        default: true

concurrency:
  # By full ref (refs/heads/main, refs/tags/v0.2.0, refs/pull/N/merge): a newer push cancels an older run of the same
  # ref only, never a tag build.
  group: mpvfx-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    # A pull request that changes only documentation (Markdown anywhere, mpvfx-swift/docs/, the licence files) needs no
    # build or test: every job below is skipped on purpose and ci-ok passes in about a minute. No test or build step
    # reads those files (checked 2026-10-19). Any other event, or any other file, runs everything.
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
      # true: the pull request changes the test jobs OneTake-actionRunners-1 runs from main (mpvfx-ci.yml, its generated
      # mpvfx-ci-tests-source.yml or source_workflows.py), so every shard runs here, with its own definition.
      workflow: ${{ steps.files.outputs.workflow }}
    steps:
      - name: Changed files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          # Both sides of a rename count: code renamed to a .md name is still a code change.
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/files.txt"
          n=$(wc -l < "$RUNNER_TEMP/files.txt")
          if [ "$n" -ge 3000 ] || grep -qE '^\.github/(workflows/mpvfx-ci(-tests-source)?\.yml|ci/source_workflows\.py)$' "$RUNNER_TEMP/files.txt"; then
            echo "workflow=true" >> "$GITHUB_OUTPUT"
          fi
          other=$(grep -vE '\.md$|^mpvfx-swift/docs/|^(LICENSE|LICENSE-MIT|LICENSE-APACHE|NOTICE)$' "$RUNNER_TEMP/files.txt" || true)
          if [ "$n" -gt 0 ] && [ "$n" -lt 3000 ] && [ -z "$other" ]; then
            echo "code=false" >> "$GITHUB_OUTPUT"; echo "documentation only ($n files): build and tests skipped"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"; printf 'code changes:\n%s\n' "$other" | head -20
          fi

  plan:
    # Which Linux and Windows test shards this run needs: those with no pass recorded for their inputs.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      linux_shards: ${{ steps.pick.outputs.linux }}
      windows_shards: ${{ steps.pick.outputs.windows }}
      # The shards remote-shards sends to OneTake-actionRunners-1 (names), and their input keys by "<os>/<shard>".
      remote_linux: ${{ steps.pick.outputs.remote_linux }}
      remote_windows: ${{ steps.pick.outputs.remote_windows }}
      remote_keys: ${{ steps.pick.outputs.remote_keys }}
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test shard keys
        id: keys
        run: |
          swift package dump-package > "$RUNNER_TEMP/package.json"
          echo "linux=$(python3 -I -B ../.github/ci/test-shards.py --os linux "$RUNNER_TEMP/package.json")" >> "$GITHUB_OUTPUT"
          echo "windows=$(python3 -I -B ../.github/ci/test-shards.py --os windows "$RUNNER_TEMP/package.json")" >> "$GITHUB_OUTPUT"
      - name: Pass recorded for linux library?
        id: l0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-library-${{ fromJSON(steps.keys.outputs.linux)[0].key }}
          lookup-only: true
      - name: Pass recorded for linux audio-presets?
        id: l1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-audio-presets-${{ fromJSON(steps.keys.outputs.linux)[1].key }}
          lookup-only: true
      - name: Pass recorded for linux audio-live?
        id: l2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-audio-live-${{ fromJSON(steps.keys.outputs.linux)[2].key }}
          lookup-only: true
      - name: Pass recorded for linux rest?
        id: l3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-rest-${{ fromJSON(steps.keys.outputs.linux)[3].key }}
          lookup-only: true
      - name: Pass recorded for windows library?
        id: w0
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: windows-pass-library-${{ fromJSON(steps.keys.outputs.windows)[0].key }}
          lookup-only: true
          enableCrossOsArchive: true
      - name: Pass recorded for windows audio-presets?
        id: w1
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: windows-pass-audio-presets-${{ fromJSON(steps.keys.outputs.windows)[1].key }}
          lookup-only: true
          enableCrossOsArchive: true
      - name: Pass recorded for windows audio-live?
        id: w2
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: windows-pass-audio-live-${{ fromJSON(steps.keys.outputs.windows)[2].key }}
          lookup-only: true
          enableCrossOsArchive: true
      - name: Pass recorded for windows rest?
        id: w3
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: windows-pass-rest-${{ fromJSON(steps.keys.outputs.windows)[3].key }}
          lookup-only: true
          enableCrossOsArchive: true
      - name: Shards to run
        id: pick
        env:
          LINUX: ${{ steps.keys.outputs.linux }}
          WINDOWS: ${{ steps.keys.outputs.windows }}
          FULL: ${{ github.event_name == 'schedule' || inputs.full_tests == true }}
          LINUX_HITS: ${{ steps.l0.outputs.cache-hit }},${{ steps.l1.outputs.cache-hit }},${{ steps.l2.outputs.cache-hit }},${{ steps.l3.outputs.cache-hit }}
          WINDOWS_HITS: ${{ steps.w0.outputs.cache-hit }},${{ steps.w1.outputs.cache-hit }},${{ steps.w2.outputs.cache-hit }},${{ steps.w3.outputs.cache-hit }}
          # Shards marked `runners` (test-shards.py RUNNERS) go to OneTake-actionRunners-1 when both App secrets are
          # set and the commit is this repository's (never a fork's pull request) and does not change the test jobs that
          # repository runs from main (changes.outputs.workflow); otherwise every shard runs here.
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
          APP_KEY: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          OWN: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && needs.changes.outputs.workflow != 'true' }}
        run: |
          python3 -I -B - <<'PY'
          import json, os
          full = os.environ["FULL"] == "true"
          remote_ok = bool(os.environ["APP_ID"]) and bool(os.environ["APP_KEY"]) and os.environ["OWN"] == "true"
          print(f"::notice::{'shards marked runners run on OneTake-actionRunners-1' if remote_ok else 'every shard runs here (no RUNNERS_APP_* secrets, or a fork)'}")
          def pick(label, shards, hits):
              hits = os.environ[hits].split(",")
              assert len(hits) == len(shards), f"{label}: {len(shards)} shards, {len(hits)} lookups"
              run = [s for s, hit in zip(shards, hits) if full or hit != "true"]
              for s in shards:
                  print(f"::notice::{label} {s['shard']}: {'runs' if s in run else 'passed before on these exact inputs, not rerun'}")
              return run
          linux = pick("linux shard", json.loads(os.environ["LINUX"]), "LINUX_HITS")
          windows = pick("windows shard", json.loads(os.environ["WINDOWS"]), "WINDOWS_HITS")
          # Each shard runs in exactly one place: here, or on OneTake-actionRunners-1.
          remote = {o: [s for s in run if remote_ok and s["runners"]] for o, run in (("linux", linux), ("windows", windows))}
          local = {o: [s for s in run if s not in remote[o]] for o, run in (("linux", linux), ("windows", windows))}
          keys = {f"{o}/{s['shard']}": s["key"] for o in remote for s in remote[o]}
          for o in remote:
              for s in remote[o]:
                  print(f"::notice::{o} shard {s['shard']}: runs on OneTake-actionRunners-1")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"linux={json.dumps(local['linux'])}\nwindows={json.dumps(local['windows'])}\n")
              out.write(f"remote_linux={json.dumps([s['shard'] for s in remote['linux']])}\n")
              out.write(f"remote_windows={json.dumps([s['shard'] for s in remote['windows']])}\n")
              out.write(f"remote_keys={json.dumps(keys)}\n")
          PY

  checks:
    # Fast checks that need no Swift build: the fetch script's tests and copyright blocks.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: fetch-binaries tests
        run: python3 -I -B scripts/test_fetch_binaries.py
      - name: Copyright blocks
        working-directory: .
        run: python3 -I -B mpvfx-swift/scripts/copyright.py

  linux:
    # Build, package and install smoke; the tests run in linux-test beside it.
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - name: System packages
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev libpulse-dev \
            xvfb xauth dbus-x11 python3 file patchelf libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Generated GPU shaders are current
        run: python3 -I scripts/gpu/gen-compute-shaders.py --check
      - name: Restore caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-release-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            linux-release-${{ github.ref_name }}-
            linux-release-
      - name: Toolchain version
        run: swift --version
      - name: Release build (static Swift runtime)
        run: swift build -c release --static-swift-stdlib -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Package
        run: |
          short=${GITHUB_SHA::7}; name=mpvfx-linux-x64-$short; out="$GITHUB_WORKSPACE/dist/$name"
          mkdir -p "$out"
          bin=$(swift build -c release --static-swift-stdlib --show-bin-path)
          cp "$bin/MpVFX" "$out/"
          # Shipped binaries carry no symbols (strip-check.yml verifies every installer); the debug symbols stay in
          # CI as the symbols-linux artifact for symbolicating crash reports from this build.
          mkdir -p "$GITHUB_WORKSPACE/symbols"
          objcopy --only-keep-debug "$out/MpVFX" "$GITHUB_WORKSPACE/symbols/MpVFX-linux-x64-$short.debug"
          strip --strip-unneeded "$out/MpVFX"
          for b in "$bin"/*.resources; do [ -e "$b" ] && cp -R "$b" "$out/"; done
          # The engine libraries travel next to the program, which finds them through $ORIGIN.
          cp -L .binaries/*/lib/*.so* "$out/"
          patchelf --set-rpath '$ORIGIN' "$out/MpVFX"
          for c in .binaries/*/; do c=$(basename "$c"); mkdir -p "$out/licenses/$c"; cp .binaries/"$c"/LICENSE .binaries/"$c"/NOTICE "$out/licenses/$c/" 2>/dev/null || true; done
          cat > "$out/README.txt" <<TXT
          MpVFX for Linux x86-64 ($GITHUB_SHA)
          Run: ./MpVFX
          The Swift runtime is linked into the binary; the media and keyframe engine libraries (proprietary, see
          LICENSE in the source repository) are the .so files beside it. System libraries it needs:
          GTK 3, PulseAudio client and SQLite 3 (Ubuntu 24.04 and later: sudo apt install libgtk-3-0t64 libpulse0 libsqlite3-0; older Debian/Ubuntu: libgtk-3-0).
          TXT
          sed -i 's/^ *//' "$out/README.txt"
          echo "--- ldd"; ldd "$out/MpVFX" | tee "$RUNNER_TEMP/ldd.txt"
          if grep -E "libswift|libFoundation|libdispatch|libBlocksRuntime|libicu|not found" "$RUNNER_TEMP/ldd.txt"; then
            echo "::error::the binary needs toolchain libraries or misses an engine library"; exit 1
          fi
          tar -C "$GITHUB_WORKSPACE/dist" -czf "$GITHUB_WORKSPACE/dist/$name.tar.gz" "$name"
          ls -l "$GITHUB_WORKSPACE/dist"
      - name: Debian package
        run: |
          export MPVFX_BUILD=${GITHUB_SHA::7}
          sh packaging/linux/build-deb.sh "$GITHUB_WORKSPACE/dist" "$(swift build -c release --static-swift-stdlib --show-bin-path)"
      - name: Launch smoke from the installed package (Xvfb, no toolchain paths)
        timeout-minutes: 8
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -yq "$GITHUB_WORKSPACE"/dist/mpvfx_*.deb
          test -x /usr/bin/mpvfx && test -f /usr/share/applications/app.onetake.mpvfx.desktop
          ls /usr/lib/mpvfx/
          mv .binaries "$RUNNER_TEMP/binaries-hidden"   # the installed program must not reach the build's copies
          home=$(mktemp -d)
          env -i HOME="$home" PATH=/usr/bin:/bin MPVFX_HIDDEN_TEST_WINDOW=1 MPVFX_SMOKE_DELAY_MS=2500 \
            MPVFX_SMOKE_SNAPSHOT="$GITHUB_WORKSPACE/dist/linux-smoke.png" \
            xvfb-run -a -s "-screen 0 1440x900x24" dbus-run-session -- mpvfx
          mv "$RUNNER_TEMP/binaries-hidden" .binaries
          test -s "$GITHUB_WORKSPACE/dist/linux-smoke.png"
          file "$GITHUB_WORKSPACE/dist/linux-smoke.png"
          DEBIAN_FRONTEND=noninteractive apt-get remove -yq mpvfx
          test ! -e /opt/mpvfx/MpVFX && test ! -e /usr/lib/mpvfx
      - name: Save caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-release-${{ github.ref_name }}-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: linux
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/linux-smoke.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: symbols-linux
          path: symbols/*.debug
          if-no-files-found: ignore
          retention-days: 90

  linux-test:
    # One test shard (.github/ci/test-shards.py) per job, only those the plan job found no pass for.
    needs: plan
    if: needs.plan.outputs.linux_shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.linux_shards) }}
    name: linux test (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    container: swift:6.3.3-noble
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - name: System packages
        working-directory: /
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            git curl ca-certificates zstd build-essential pkg-config libgtk-3-dev libsqlite3-dev libpulse-dev \
            xvfb xauth dbus-x11 python3 file libvulkan-dev mesa-vulkan-drivers
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Restore caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-debug-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            linux-debug-${{ github.ref_name }}-
            linux-debug-
      - name: Build
        run: swift --version && swift build --build-tests -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Test
        env:
          FILTER: ${{ matrix.filter }}
          SKIP: ${{ matrix.skip }}
        # In batches: the selected tests reach the XCTest runner as one argument, which has a length limit.
        run: python3 -I -B -u ../.github/ci/run-shard.py 2>&1 | tee "$RUNNER_TEMP/test.log"; exit "${PIPESTATUS[0]}"
      - name: Test counts
        if: always()
        run: grep -E "^shard:|Test Suite 'All tests' (passed|failed)" -A1 "$RUNNER_TEMP/test.log" | grep -E "^shard:|Executed" || true
      - name: Record the pass for these inputs
        run: cp "$RUNNER_TEMP/test.log" .test-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-${{ matrix.shard }}-${{ matrix.key }}
      - name: Save caches
        if: always() && matrix.shard == 'rest'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: linux-debug-${{ github.ref_name }}-${{ github.sha }}

  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Engine libraries (binaries.lock)
        run: python -I -B scripts/fetch-binaries.py
      - name: Restore caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: windows-release-${{ github.sha }}
          restore-keys: windows-release-
      - name: Toolchain version
        run: swift --version
      - name: Release build, linked without debug data (strip-check.yml verifies the shipped exe)
        # One build: a second release build without -debug:none would relink MpVFX.exe with debug data.
        run: swift build -c release -Xswiftc -warnings-as-errors -Xcc -Werror -Xlinker -debug:none
      - name: Package (portable zip)
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,7); $name = "mpvfx-windows-x64-$short"
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'; $out = Join-Path $dist $name
          New-Item -ItemType Directory -Force $out | Out-Null
          $bin = (swift build -c release --show-bin-path).Trim()
          Copy-Item (Join-Path $bin 'MpVFX.exe') $out
          Get-ChildItem $bin -Directory -Filter '*.resources' | ForEach-Object { Copy-Item $_.FullName $out -Recurse }
          # The engine DLLs (binaries.lock) go next to the exe, where Windows looks first.
          Get-ChildItem '.binaries\*\bin\*.dll' | ForEach-Object { Copy-Item $_.FullName $out }
          Get-ChildItem '.binaries' -Directory | ForEach-Object {
            $l = Join-Path $out "licenses\$($_.Name)"; New-Item -ItemType Directory -Force $l | Out-Null
            Get-ChildItem $_.FullName -File | Where-Object { $_.Name -in 'LICENSE', 'NOTICE' } | ForEach-Object { Copy-Item $_.FullName $l }
          }
          $core = (where.exe swiftCore.dll | Select-Object -First 1); if (-not $core) { throw 'swiftCore.dll not on PATH' }
          $rt = Split-Path $core; Write-Host "Swift runtime: $rt"
          Get-ChildItem $rt -Filter '*.dll' | ForEach-Object { Copy-Item $_.FullName $out }
          foreach ($d in 'vcruntime140.dll','vcruntime140_1.dll','msvcp140.dll','msvcp140_1.dll','msvcp140_2.dll','concrt140.dll') {
            $p = Join-Path $env:WINDIR "System32\$d"; if (Test-Path $p) { Copy-Item $p $out } else { throw "$d missing on the runner" }
          }
          @"
          MpVFX for Windows x64 ($env:GITHUB_SHA)
          Unzip anywhere and run MpVFX.exe. The Swift runtime, the MSVC runtime and the media and keyframe engine DLLs
          (proprietary, see LICENSE in the source repository) are included; no installs needed. Windows 10 or 11, x64.
          "@ -replace '(?m)^ +','' | Set-Content (Join-Path $out 'README.txt')
          Compress-Archive -Path $out -DestinationPath (Join-Path $dist "$name.zip")
          Get-ChildItem $out | Format-Table Name, Length
      - name: Installer (setup.exe)
        shell: pwsh
        run: |
          $short = $env:GITHUB_SHA.Substring(0,7); $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          pwsh packaging/windows/build-setup.ps1 -AppDir (Join-Path $dist "mpvfx-windows-x64-$short") -Dist $dist
      - name: Install, launch smoke and uninstall (PATH without the Swift toolchain or the engine folders)
        timeout-minutes: 10
        shell: pwsh
        run: |
          $dist = Join-Path $env:GITHUB_WORKSPACE 'dist'
          $setup = Get-ChildItem $dist -Filter 'MpVFX-*-setup.exe' | Select-Object -First 1
          $p = Start-Process $setup.FullName -ArgumentList '/Q:A' -Wait -PassThru
          Write-Host "setup exit code $($p.ExitCode)"
          $home_ = Join-Path $env:LOCALAPPDATA 'Programs\MpVFX'; $exe = Join-Path $home_ 'MpVFX.exe'
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'MpVFX.lnk'
          if (-not (Test-Path $lnk)) { throw "no Start menu shortcut: $lnk" }
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\MpVFX'
          Get-ItemProperty $key | Format-List DisplayName, DisplayVersion, InstallLocation, UninstallString
          $png = Join-Path $dist 'windows-smoke.png'
          $savedPath = $env:PATH
          $env:PATH = "$env:WINDIR\System32;$env:WINDIR;$env:WINDIR\System32\WindowsPowerShell\v1.0"
          Remove-Item Env:SDKROOT -ErrorAction SilentlyContinue
          $env:MPVFX_HIDDEN_TEST_WINDOW = '1'; $env:MPVFX_SMOKE_DELAY_MS = '2500'; $env:MPVFX_SMOKE_SNAPSHOT = $png
          $p = Start-Process -FilePath $exe -WorkingDirectory $home_ -NoNewWindow -Wait -PassThru
          Write-Host "exit code $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "MpVFX.exe exited with $($p.ExitCode)" }
          if (-not (Test-Path $png) -or (Get-Item $png).Length -eq 0) { throw 'no smoke snapshot written' }
          Get-Item $png | Format-Table Name, Length
          $env:PATH = $savedPath
          $p = Start-Process powershell.exe -ArgumentList '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', (Join-Path $home_ 'uninstall.ps1'), '-Quiet' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "uninstall exited with $($p.ExitCode)" }
          if ((Test-Path $home_) -or (Test-Path $lnk) -or (Test-Path $key)) { throw 'uninstall left files, the shortcut or the registry entry behind' }
          Write-Host 'installed, launched and uninstalled'
      - name: Save caches
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: windows-release-${{ github.sha }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe
            dist/windows-smoke.png
          if-no-files-found: ignore

  windows-test:
    needs: plan
    if: needs.plan.outputs.windows_shards != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.windows_shards) }}
    name: windows test (${{ matrix.shard }})
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: compnerd/gha-setup-swift@775d3f4111c5be58a0f62f2efdd353bb8fac15c7
        with:
          swift-version: swift-6.3.3-release
          swift-build: 6.3.3-RELEASE
      - name: Engine libraries (binaries.lock), DLL folders on PATH for the test runner
        run: |
          python -I -B scripts/fetch-binaries.py
          for d in .binaries/*/bin; do cygpath -w "$PWD/$d" >> "$GITHUB_PATH"; done
      - name: Restore caches
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: windows-debug-${{ github.sha }}
          restore-keys: windows-debug-
      - name: Build
        run: swift --version && swift build --build-tests -Xswiftc -warnings-as-errors -Xcc -Werror
      - name: Test
        env:
          FILTER: ${{ matrix.filter }}
          SKIP: ${{ matrix.skip }}
        run: python -I -B -u ../.github/ci/run-shard.py 2>&1 | tee "$RUNNER_TEMP/test.log"; exit "${PIPESTATUS[0]}"
      - name: Test counts
        if: always()
        run: grep -E "^shard:|Test Suite 'All tests' (passed|failed)" -A1 "$RUNNER_TEMP/test.log" | grep -E "^shard:|Executed" || true
      - name: Record the pass for these inputs
        run: cp "$RUNNER_TEMP/test.log" .test-pass
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: windows-pass-${{ matrix.shard }}-${{ matrix.key }}
          enableCrossOsArchive: true   # looked up by the plan job on Linux
      - name: Save caches
        if: always() && matrix.shard == 'rest'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.build
          key: windows-debug-${{ github.sha }}

  remote-shards:
    # The test shards the plan job marked for OneTake-app/OneTake-actionRunners-1 (test-shards.py RUNNERS: three Linux
    # shards; Windows none yet): one repository_dispatch `onetake-test-shards` with their names and this commit. That
    # repository calls mpvfx-ci-tests-source.yml (linux-test, generated by .github/ci/source_workflows.py) and
    # sets one commit status per shard on the head commit, `<os> test (<shard>) (runners-1)`, each naming this run.
    # This job waits for those statuses (.github/ci/remote_shards.py, one read a minute) and fails when one fails,
    # errors or has not reported by its deadline, so ci-ok still requires every shard. A pass is then recorded under
    # the shard's input key here, exactly as linux-test records its own. Never runs for a fork or
    # without both RUNNERS_APP_* secrets: the plan job then keeps every shard here.
    needs: plan
    if: needs.plan.result == 'success' && (needs.plan.outputs.remote_linux != '[]' || needs.plan.outputs.remote_windows != '[]')
    runs-on: ubuntu-24.04
    timeout-minutes: 50   # a shard's 30, its build without a cache, and a margin for the other pool's queue
    permissions:
      contents: read
      statuses: read
    steps:
      - name: Runners App token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: OneTake-app
          repositories: OneTake-actionRunners-1
          permission-contents: write   # repository_dispatch needs it
      - name: Send the shards to OneTake-actionRunners-1
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.sha }}   # the commit linux-test and windows-test check out (a pull request's merge commit)
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}   # the commit that carries the statuses
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
          LINUX: ${{ needs.plan.outputs.remote_linux }}
          WINDOWS: ${{ needs.plan.outputs.remote_windows }}
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg head "$HEAD" --arg run "$RUN" \
            --argjson linux "$LINUX" --argjson windows "$WINDOWS" \
            '{event_type: "onetake-test-shards", client_payload: {repository: $repo, sha: $sha, head: $head, run: $run, linux: $linux, windows: $windows}}' |
            gh api -X POST repos/OneTake-app/OneTake-actionRunners-1/dispatches --input -
          echo "linux $LINUX and windows $WINDOWS run on OneTake-app/OneTake-actionRunners-1 (run $RUN)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github
          persist-credentials: false
      - name: Wait for every shard's status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
          LINUX: ${{ needs.plan.outputs.remote_linux }}
          WINDOWS: ${{ needs.plan.outputs.remote_windows }}
        run: python3 -I -B -u .github/ci/remote_shards.py --minutes 45 | tee -a "$GITHUB_STEP_SUMMARY"; exit "${PIPESTATUS[0]}"
      - name: Pass record
        env:
          RUN: ${{ github.run_id }}/${{ github.run_attempt }}
        run: mkdir -p mpvfx-swift && echo "passed on OneTake-app/OneTake-actionRunners-1 for oneTake run $RUN" > mpvfx-swift/.test-pass
      - name: Record the pass of linux library
        if: contains(fromJSON(needs.plan.outputs.remote_linux), 'library')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-library-${{ fromJSON(needs.plan.outputs.remote_keys)['linux/library'] }}
      - name: Record the pass of linux audio-presets
        if: contains(fromJSON(needs.plan.outputs.remote_linux), 'audio-presets')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-audio-presets-${{ fromJSON(needs.plan.outputs.remote_keys)['linux/audio-presets'] }}
      - name: Record the pass of linux audio-live
        if: contains(fromJSON(needs.plan.outputs.remote_linux), 'audio-live')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mpvfx-swift/.test-pass
          key: linux-pass-audio-live-${{ fromJSON(needs.plan.outputs.remote_keys)['linux/audio-live'] }}

  macos-runners:
    # The organization OneTake-app has its own pool of GitHub-hosted runners, with its own macOS slots. A push to main,
    # the nightly run (every shard, kind nightly) or a pull request labelled `macos` sends its macOS build there: a repository_dispatch to OneTake-actionRunners-1,
    # which calls mpvfx-macos.yml on this commit, reports the commit status `macos (runners-1)` here and, for main,
    # uploads the disk image into this commit's nightly release. Without the RUNNERS_APP_* secrets (a fork, or before
    # they are set) nothing is sent and the macos job below builds here instead. Fork pull requests are never sent:
    # their head commit is not in this repository, and OneTake-actionRunners-1 builds only marshiyar/oneTake.
    needs: changes
    if: >-
      needs.changes.outputs.code == 'true'
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'schedule'
      || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'macos')
      && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sent: ${{ steps.send.outputs.sent }}
    steps:
      - name: Runners App configured
        id: have
        env:
          APP_ID: ${{ secrets.RUNNERS_APP_ID }}
          APP_KEY: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
        # Both secrets, or neither is used: a half-set pair builds here instead of failing the token step.
        run: echo "app=$([ -n "$APP_ID" ] && [ -n "$APP_KEY" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Runners App token
        id: token
        if: steps.have.outputs.app == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RUNNERS_APP_ID }}
          private-key: ${{ secrets.RUNNERS_APP_PRIVATE_KEY }}
          owner: OneTake-app
          repositories: OneTake-actionRunners-1
          permission-contents: write   # repository_dispatch needs it
      - name: Hand the macOS build to OneTake-actionRunners-1
        id: send
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          KIND: ${{ github.event_name == 'pull_request' && 'pr' || 'nightly' }}
          FULL: ${{ github.event_name == 'schedule' }}   # the nightly run tests every shard, as it does here
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::RUNNERS_APP_ID is not set: macOS builds on this repository's runners"
            echo "sent=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg kind "$KIND" --arg run "$RUN_URL" --arg full "$FULL" \
            '{event_type: "onetake-macos", client_payload: {repository: $repo, sha: $sha, kind: $kind, run: $run, full: $full}}' |
            gh api -X POST repos/OneTake-app/OneTake-actionRunners-1/dispatches --input -
          echo "sent=true" >> "$GITHUB_OUTPUT"
          echo "macOS for $SHA runs on OneTake-app/OneTake-actionRunners-1 (status: macos (runners-1))" >> "$GITHUB_STEP_SUMMARY"

  macos:
    # Owner ruling 2026-10-21: macOS never holds the other platforms back. The macOS runners (xcode-27) are scarce and
    # queued jobs sat for an hour before being cancelled, so a pull request builds macOS only when it carries the
    # `macos` label. Main and labelled pull requests go to OneTake-actionRunners-1 (macos-runners) and build here only
    # when that hand-off was not sent, and so does the nightly run; tags and a dispatch always build here.
    needs: [changes, macos-runners]
    if: >-
      always() && needs.changes.outputs.code == 'true'
      && (github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'macos'))
      && needs.macos-runners.outputs.sent != 'true'
    uses: ./.github/workflows/mpvfx-macos.yml
    secrets: inherit   # only the optional Apple signing secrets; unset, the disk image is ad-hoc signed
    with:
      full_tests: ${{ github.event_name == 'schedule' || inputs.full_tests == true }}

  ci-ok:
    # The one required check: every job passed or was skipped on purpose.
    needs: [changes, plan, checks, linux, linux-test, windows, windows-test, remote-shards, macos-runners, macos]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every required job passed or was skipped
        env:
          REQUIRED: >-
            ${{ needs.changes.result }} ${{ needs.plan.result }} ${{ needs.checks.result }} ${{ needs.linux.result }}
            ${{ needs.linux-test.result }} ${{ needs.windows.result }} ${{ needs.windows-test.result }}
            ${{ needs.remote-shards.result }}
          MACOS: ${{ needs.macos-runners.result }} ${{ needs.macos.result }}
        run: |
          echo "required job results: $REQUIRED; macos-runners, macos: $MACOS"
          # macOS is reported, not required (owner ruling 2026-10-21): a macOS failure, or a job cancelled while it
          # waited for a runner, warns instead of failing the other platforms.
          for r in $MACOS; do
            case "$r" in success|skipped) ;; *) echo "::warning::a macos job ended $r; it is not required for ci-ok" ;; esac
          done
          for r in $REQUIRED; do
            case "$r" in success|skipped) ;; *) echo "::error::a required job ended $r"; exit 1 ;; esac
          done

  publish:
    needs: [plan, checks, linux, linux-test, windows, windows-test, remote-shards]
    # Only main (nightly prerelease) and v* tags publish; publish.sh decides which release.
    # Owner ruling 2026-10-21: no OS holds another back. Linux and Windows publish as soon as they pass, without waiting
    # for a macOS runner; publish-macos adds the disk image to the same release when the macOS job finishes. A stable
    # v<X.Y.Z> tag is the public launch and ships every OS or none, so publish-macos publishes it alone.
    if: >-
      always() && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-')))
      && needs.plan.result == 'success' && needs.checks.result == 'success'
      && (needs.linux.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # An OS passed when its build and every shard did: those here (linux-test, windows-test) and those sent to
      # OneTake-actionRunners-1 (remote-shards; it is not needed only when nothing of that OS was sent).
      LINUX_OK: >-
        ${{ needs.linux.result == 'success' && (needs.linux-test.result == 'success'
        || (needs.linux-test.result == 'skipped' && needs.plan.outputs.linux_shards == '[]'))
        && (needs.remote-shards.result == 'success' || needs.plan.outputs.remote_linux == '[]') }}
      WINDOWS_OK: >-
        ${{ needs.windows.result == 'success' && (needs.windows-test.result == 'success'
        || (needs.windows-test.result == 'skipped' && needs.plan.outputs.windows_shards == '[]'))
        && (needs.remote-shards.result == 'success' || needs.plan.outputs.remote_windows == '[]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # publish.sh, VERSION (checked against a v* tag) and the root files (CHANGELOG.md, when there is one).
          sparse-checkout: |
            .github
            mpvfx-swift/packaging
      # One download per OS that passed; the symbols-* artifacts stay in CI.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.LINUX_OK == 'true'
        with:
          path: dist
          name: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.WINDOWS_OK == 'true'
        with:
          path: dist
          name: windows
      - name: Release (Linux and Windows)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for os in LINUX WINDOWS; do
            ok="${os}_OK"; [ "${!ok}" = true ] || echo "::warning::${os,,} did not pass; this release leaves it out"
          done
          shopt -s nullglob
          files=(dist/*.deb dist/*-setup.exe dist/*.tar.gz dist/*.zip dist/*-smoke.png)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no installer to publish"; exit 1; }
          bash .github/ci/publish.sh "${files[@]}"

  publish-macos:
    # After publish (so the two never race to create the release), whatever publish's result: on main and prerelease
    # tags it uploads the macOS disk image into the same release; on a stable v<X.Y.Z> tag it publishes every OS at
    # once and fails unless all of them passed.
    needs: [plan, checks, linux, linux-test, windows, windows-test, remote-shards, macos, publish]
    if: >-
      always() && github.event_name != 'pull_request'
      && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      && needs.plan.result == 'success' && needs.checks.result == 'success'
      && (needs.macos.result == 'success' || (startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-')))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      STABLE: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
      # An OS passed when its build and every shard did: those here (linux-test, windows-test) and those sent to
      # OneTake-actionRunners-1 (remote-shards; it is not needed only when nothing of that OS was sent).
      LINUX_OK: >-
        ${{ needs.linux.result == 'success' && (needs.linux-test.result == 'success'
        || (needs.linux-test.result == 'skipped' && needs.plan.outputs.linux_shards == '[]'))
        && (needs.remote-shards.result == 'success' || needs.plan.outputs.remote_linux == '[]') }}
      WINDOWS_OK: >-
        ${{ needs.windows.result == 'success' && (needs.windows-test.result == 'success'
        || (needs.windows-test.result == 'skipped' && needs.plan.outputs.windows_shards == '[]'))
        && (needs.remote-shards.result == 'success' || needs.plan.outputs.remote_windows == '[]') }}
      MACOS_OK: ${{ needs.macos.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            mpvfx-swift/packaging
      - name: Every OS passed (stable tag)
        if: env.STABLE == 'true'
        run: |
          for os in LINUX WINDOWS MACOS; do
            ok="${os}_OK"
            [ "${!ok}" = true ] || { echo "::error::${os,,} did not pass; a stable release ships every OS"; exit 1; }
          done
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.STABLE == 'true'
        with:
          path: dist
          name: linux
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: env.STABLE == 'true'
        with:
          path: dist
          name: windows
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          name: macos
      - name: Release (macOS, or every OS on a stable tag)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.deb dist/*-setup.exe dist/*.tar.gz dist/*.zip dist/*-smoke.png)
          [ "${#files[@]}" -gt 0 ] || { echo "::error::no installer to publish"; exit 1; }
          bash .github/ci/publish.sh "${files[@]}"
