name: codeql-swift

# CodeQL's analysis of the Swift app, as a reusable workflow with one caller in each place it may run:
#   - codeql.yml (job swift) in this repository: the weekly run, a dispatch, and any push or pull request whose
#     hand-off to OneTake-app/OneTake-actionRunners-1 was not sent (no RUNNERS_APP_* secrets, a fork);
#   - OneTake-app/OneTake-actionRunners-1 (onetake-codeql-swift.yml), on its own organization's macOS runners, for
#     pushes to main and pull requests from this repository's branches.
# It never uploads: the SARIF file is the artifact `sarif-swift` of the run, and the caller uploads it (codeql.yml
# with github/codeql-action/upload-sarif; the runners repository through the code scanning API with its App token). So
# the job that builds this repository's code under the tracer holds a read-only token in both places.
#
# CodeQL's Swift extractor runs only on macOS (the action and the extractor both refuse Linux) and supports Swift up to
# 6.3.x. The xcode-27 image only has Xcode 27 (Swift 6.4), so the job uses the macos-26 image, whose Xcode 26.x carries
# Swift 6.3; the step below fails loudly if the selected Xcode is not on 6.3.

on:
  workflow_call:
    inputs:
      # Set by OneTake-app/OneTake-actionRunners-1: the repository and commit to analyse. Empty (the call from
      # codeql.yml), the run's own commit is analysed.
      source_repository:
        type: string
        default: ''
      source_ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  analyze:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      XCODE_VERSION: '26.6'
    defaults:
      run:
        shell: bash
        working-directory: mpvfx-swift
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ inputs.source_repository || github.repository }}
          ref: ${{ inputs.source_ref }}
          persist-credentials: false   # nothing here uses git against origin
      - name: Xcode ${{ env.XCODE_VERSION }} (Swift 6.3)
        run: |
          x=/Applications/Xcode_${XCODE_VERSION}.app
          test -d "$x" || { echo "::error::$x is not on this runner"; ls -d /Applications/Xcode*.app; exit 1; }
          sudo xcode-select -s "$x/Contents/Developer"
          xcodebuild -version && swift --version
          swift --version 2>&1 | grep -q 'Swift version 6\.3' || { echo "::error::CodeQL supports Swift up to 6.3.x; Xcode $XCODE_VERSION is not on 6.3"; exit 1; }
      - name: Engine libraries (binaries.lock)
        run: python3 -I -B scripts/fetch-binaries.py
      - name: Metal toolchain
        run: sh ../.github/ci/metal-toolchain.sh
      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality
      - name: Build under the CodeQL tracer
        # The tracer starts SwiftPM as x86_64 (Rosetta), which then builds for x86_64 and cannot link the arm64 engine
        # libraries (job 118341253370), so the target is pinned to the runner's arm64. --disable-sandbox: under the
        # tracer SwiftPM's sandbox-exec for the manifest fails with "Bad CPU type in executable" (job 118273895982);
        # the sandbox only wraps the manifest and plugins, not what is analysed.
        run: swift build --disable-sandbox --triple arm64-apple-macosx15.0
      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: /language:swift
          upload: never
          output: ${{ runner.temp }}/sarif
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sarif-swift
          path: ${{ runner.temp }}/sarif/*.sarif
          if-no-files-found: error
          retention-days: 7
