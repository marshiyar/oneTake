# Prebuilt engine libraries the app links. The engines are proprietary and are not built from this repository: each
# entry pins one release of marshiyar/mpvfx-media-binaries by version, download URL and SHA-256 per platform.
# `python3 scripts/fetch-binaries.py` downloads the archive for this machine, checks the SHA-256 and unpacks it into
# .binaries/<component>/. A component whose sha256 is empty is pending: its release is not published yet, and
# fetching it fails with a message saying so. Never edit a sha256 by hand: `python3 scripts/fetch-binaries.py --update <component> <version>`
# reads the release and rewrites the entry.
#
# Release archive contract: <asset>.tar.gz (or .zip on Windows) per platform, optionally inside one top-level folder,
# plus a SHA256SUMS file in the release:
#   include/<header>                  the C interface
#   lib/lib<library>.dylib            macOS, install name @rpath/lib<library>.dylib
#   lib/lib<library>.so               Linux, SONAME lib<library>.so
#   lib/<library>.lib (or .dll.lib) and bin/ or lib/<library>.dll   Windows x64 (import library + DLL)
#   LICENSE, NOTICE                   the binary licence and third-party notices (shipped with the app)
# Platforms: macos-arm64, macos-x86_64, linux-x86_64, linux-aarch64, windows-x86_64.

